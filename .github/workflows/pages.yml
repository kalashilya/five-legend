# Публикация игры на GitHub Pages: при каждом обновлении ветки main сайт обновляется сам (≈1 минута).
# На сайт попадает только готовый файл игры (как index.html) и файлы приложения из pyaterka-legend/web.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p dist
          cp pyaterka-legend/pyaterka-legend-offline.html dist/index.html
          cp pyaterka-legend/web/* dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
