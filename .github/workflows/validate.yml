name: Validate game

on:
  push:
    branches:
      - main
      - "chatgpt/**"
      - "feature/premium-visual-redesign"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated player database
        working-directory: pyaterka-legend
        run: |
          node gen.js
          git diff --exit-code -- data.js ids.json
      - name: Check JavaScript syntax
        working-directory: pyaterka-legend
        run: |
          node --check gen.js
          node --check data.js
          node --check core.js
          node --check meta.js
          node --check ui.js
          node --check test.js
          node --check browser-smoke.js
      - name: Build offline game and run logic tests
        working-directory: pyaterka-legend
        run: |
          bash build.sh
          node test.js
      - name: Headless browser smoke test
        working-directory: pyaterka-legend
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node browser-smoke.js
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-redesign-screenshots
          path: pyaterka-legend/artifacts/
          if-no-files-found: warn
      - name: Verify offline build is up to date
        run: git diff --exit-code -- pyaterka-legend/pyaterka-legend-offline.html
