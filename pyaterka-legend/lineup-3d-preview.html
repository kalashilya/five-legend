 }else{
  mesh(geo.box,gunMat,g,[0,0,0],[1.15,.13,.16]);mesh(geo.box,gunEdge,g,[-.35,-.06,0],[.35,.22,.19]);mesh(geo.box,gunMat,g,[.24,.07,0],[.22,.24,.18]);mesh(geo.box,gunMat,g,[.1,.16,0],[.3,.07,.09]);mesh(geo.box,gunMat,g,[-.05,-.17,0],[.14,.26,.14]);
 }

 const body=new THREE.Group();root.add(body);root.userData.body=body;
 const torso=mesh(geo.capsule,cloth,body,[0,1.48,0],[1.25,1.05,.72]);
 mesh(geo.box,armor,body,[0,1.56,.34],[.78,.76,.19]);
 mesh(geo.box,cloth2,body,[0,1.98,0],[.66,.17,.62]);
 mesh(geo.box,gold,body,[0,1.56,.445],[.13,.18,.025]);
 // shoulder pads
 for(const s of [-1,1]){mesh(geo.sphere,armor,body,[s*.49,1.92,0],[.34,.25,.36]);mesh(geo.box,cloth2,body,[s*.49,1.48,.44],[.2,.34,.07]);}
 // belt and pouches

 // neck, head, helmet
 mesh(geo.cyl,skin,body,[0,2.17,0],[.18,.22,.18]);mesh(geo.sphere,skin,body,[0,2.43,0],[.31,.39,.28]);
 mesh(new THREE.SphereGeometry(.34,16,12,0,Math.PI*2,0,Math.PI*.53),armor,body,[0,2.5,0],[1.08,.82,1]);

 // backpack
 mesh(geo.box,armor,body,[0,1.62,-.43],[.57,.72,.27]);

 for(const s of [-1,1]){limb(body,[s*.22,1.03,0],[s*.25,.48,.02],.16,pants);limb(body,[s*.25,.48,.02],[s*.27,.14,.12],.13,boots);mesh(geo.box,boots,body,[s*.27,.1,.22],[.32,.18,.52]);}
 // arms pose, elbow positions and hands; weapon/tablet held across chest

 const leftElbow=p.kind==='tablet'?[-.5,1.48,.36]:[-.46,1.58,.48],rightElbow=p.kind==='tablet'?[.43,1.55,.4]:[.48,1.7,.42];

const actors=players.map(createOperator);

 const c=document.createElement('canvas');c.width=512;c.height=700;const x=c.getContext('2d');
 const grad=x.createLinearGradient(0,0,512,700);grad.addColorStop(0,'#293542');grad.addColorStop(.55,'#111a24');grad.addColorStop(1,'#080c12');x.fillStyle=grad;x.fillRect(0,0,512,700);

const positions=[[-4.2,0,0],[-2.1,0,-.2],[0,0,-.35],[2.1,0,-.2],[4.2,0,0]];
let current=-1,finished=false,started=false,elapsed=0,mode='intro',runSerial=0,cameraTarget=new THREE.Vector3(0,1.5,0);

const $=id=>document.getElementById(id);

function hideInfo(){ $('role').textContent='СОСТАВ ПРЕДСТАВЛЕН';$('name').textContent='ПЯТЬ ЛЕГЕНД';$('rating').textContent='5';$('team').textContent='ЕДИНАЯ КОМАНДА · ГОТОВА К МАТЧУ';$('counter').textContent='СОСТАВ 05 / 05';$('subtitle').textContent='Полный состав · финальный общий план';}

function enterNext(){
 if(finished)return;
 current++;
 if(current>=players.length){finishLineup();return}
 const p=players[current],a=actors[current],card=standardCards[current];if(p.rating>=87){a.visible=true;a.position.set(positions[current][0],0,-5.2);a.rotation.y=Math.PI;a.userData.targetX=positions[current][0];a.userData.phase=0;a.userData.duration=p.rating>=91?3.2:2.45;}else if(card){card.visible=true;card.position.set(positions[current][0],1.35,-5.2);card.rotation.y=Math.PI;card.scale.setScalar(.82);card.userData={phase:0,duration:1.35};}
 setInfo(p,current);$('tierNote').innerHTML=p.rating>=91?'91–99 · ELITE INTRO<br>УНИКАЛЬНЫЙ ВЫХОД':p.rating>=87?'87–90 · CINEMATIC 3D<br>ПРЕМИАЛЬНЫЙ ВЫХОД':'60–86 · STANDARD<br>КАРТОЧНАЯ ПРЕЗЕНТАЦИЯ';

function finishLineup(){finished=true;mode='final';hideInfo();$('title').textContent='Единая команда';$('tierNote').textContent='FIVE LEGENDS · READY';slots.forEach(s=>s.className='slot done');$('skip').textContent='К составу';}

function skipAll(){if(finished){reset();return}actors.forEach((a,i)=>{const p=players[i];a.visible=p.rating>=87;if(a.visible){a.position.set(positions[i][0],0,0);a.rotation.y=0;a.userData.phase=2}});standardCards.forEach((c,i)=>{if(c){c.visible=true;c.position.set(positions[i][0],1.35,0);c.rotation.y=0;c.scale.setScalar(1)}});current=4;finishLineup();}

const clockStart=performance.now();
