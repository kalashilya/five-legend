<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Матч 3D — прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Прототип матча: 3D-карта, игроки, эффекты; поверх — табло, составы, быстрый выбор плана */
:root{--f-d:'Oswald','Roboto Condensed','Arial Narrow',Impact,sans-serif;--f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--t:#f2c14e;--ct:#4aa3ff;--fg:#eef2f6;--mut:#94a0ad;--gold:#f0c477}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05080c;color:var(--fg);font-family:var(--f-d);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 8px calc(8px + env(safe-area-inset-bottom,0px))}
.hud button{pointer-events:auto;font:inherit;color:inherit;cursor:pointer}
/* табло */
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;max-width:560px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#0e1620e8,#060a0fe8);border:1px solid #ffffff1c;box-shadow:0 10px 30px #0008;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sb .tm{padding:6px 10px;min-width:0;border-bottom:3px solid var(--sc)}.sb .tm.r{text-align:right}
.sb .tm b{display:block;font:700 14px/1.1 var(--f-d);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb .tm small{display:block;font:700 10px/1.3 var(--f-m);color:var(--sc)}
.sb .mid{display:flex;align-items:center;gap:12px;padding:0 14px;background:#0009}.sb .mid>b{font:700 30px/1 var(--f-d);min-width:24px;text-align:center}
.sb .mid div{display:flex;flex-direction:column;align-items:center;gap:1px;font:600 10px/1.1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:#cfd6de}.sb .mid .clk{font:700 15px/1 var(--f-m);letter-spacing:.04em;color:#fff}.sb .mid .clk.bomb{color:#ff5a4a}
.sd-T{--sc:var(--t)}.sd-CT{--sc:var(--ct)}
.rh{display:flex;gap:2px;justify-content:center;margin:5px auto 0;max-width:560px;width:100%}.rh i{flex:1;height:4px;border-radius:2px;background:#ffffff14}.rh i.w{background:#7fe0a0}.rh i.l{background:#ff7a6a}.rh i.h{flex:0 0 6px;background:none}
/* составы */
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;max-width:560px;width:100%;margin:6px auto 0}
.pc{position:relative;display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 30%,#0a0f15e6),#0a0f15d9);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);min-width:0;transition:opacity .3s,filter .3s}
.pc .av{flex:none;width:26px;height:26px;border-radius:50%;overflow:hidden;background:#111;border:2px solid var(--sc);display:grid;place-items:center;font:700 10px var(--f-d)}.pc .av img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.pc .in{min-width:0;flex:1}.pc b{display:block;font:700 10px/1.1 var(--f-d);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .hp{display:block;height:3px;margin-top:3px;border-radius:2px;background:#ffffff1c;overflow:hidden}.pc .hp i{display:block;height:100%;width:100%;background:#7fe0a0;transition:width .35s}
.pc .kd{position:absolute;right:4px;top:3px;font:700 8px var(--f-m);color:#cfd6de}
.pc.dead{opacity:.38;filter:grayscale(1)}.pc.hit{animation:hit .35s}@keyframes hit{40%{transform:scale(1.06);box-shadow:0 0 14px var(--sc)}}
.sp{flex:1}
/* лента убийств */
.feed{position:fixed;right:8px;top:calc(118px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}
.feed div{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;background:#000b;border:1px solid #ffffff1a;font:600 11px/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em;animation:fin .25s}
.feed div.me{border-color:#ff7a6a88}.feed .t{color:var(--t)}.feed .ct{color:#7cc1ff}.feed svg{width:20px;height:8px;fill:#e9ebee}
@keyframes fin{from{opacity:0;transform:translateX(12px)}}
/* баннер */
.bn{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 22px;border-radius:12px;background:#000c;border:1px solid #ffffff22;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s}
.bn.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.bn b{font:700 26px var(--f-d);letter-spacing:.06em;text-transform:uppercase}.bn span{font-size:12px;color:#cfd6de}.bn.w b{color:#7fe0a0}.bn.l b{color:#ff8a7a}
.intro{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 1s,transform 1s;text-shadow:0 4px 24px #000}
.intro small{display:block;font:600 15px var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:#e9eef3}.intro b{display:block;font:700 64px/0.95 var(--f-d);letter-spacing:.03em;text-transform:uppercase}.intro.out{opacity:0;transform:translate(-50%,-60%)}
/* управление */
.ctl{display:flex;justify-content:center;gap:6px;margin-top:6px}
.cb{min-width:44px;height:38px;padding:0 12px;border-radius:10px;border:1px solid #ffffff24;background:#0b1118d9;font:700 13px var(--f-m)!important;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* быстрый план */
.pick{position:fixed;left:0;right:0;bottom:0;pointer-events:auto;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,#05080cf0 28%);transform:translateY(110%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.pick.on{transform:none}
.pk-h{display:flex;align-items:flex-end;justify-content:space-between;max-width:560px;margin:0 auto 10px}.pk-h b{font:700 20px var(--f-d);letter-spacing:.05em;text-transform:uppercase}.pk-h small{display:block;font:700 10px var(--f-m);letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.ring{position:relative;width:40px;height:40px}.ring svg{width:40px;height:40px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:3.5}.ring .bg{stroke:#ffffff1c}.ring .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .2s linear}.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-m)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:560px;margin:0 auto}
.tc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 11px;border-radius:14px;border:1px solid #ffffff22;background:linear-gradient(170deg,#1a2532,#0b1118);text-align:center;transition:transform .15s,border-color .2s,box-shadow .2s;overflow:hidden}
.tc::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%);opacity:.9}
.tc>*{position:relative}.tc:active{transform:scale(.96)}.tc.rec{border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 40%,transparent),0 10px 26px #0008}
.tc .ic{width:54px;height:60px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 90%,#fff),color-mix(in srgb,var(--ac) 55%,#000));color:#0b0b0b;font:700 22px var(--f-d)}
.tc b{font:700 14px/1.05 var(--f-d);letter-spacing:.04em;text-transform:uppercase}.tc small{font-size:10px;color:#b4bec9;line-height:1.25}.tc em{font-style:normal;font:700 9px var(--f-m);color:var(--gold);letter-spacing:.06em}
.tc .rc{position:absolute;top:6px;right:6px;font:700 8px/1 var(--f-m);padding:3px 5px;border-radius:4px;background:var(--gold);color:#111}
.pk-f{display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:560px;margin:10px auto 0;font-size:11px;color:var(--mut)}
.pk-f b{color:#ffd35a;font:700 14px var(--f-d)}
#nogl{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center}
@media (min-width:900px){.feed{top:130px}.row{max-width:760px}.sb{max-width:760px}}
@media (prefers-reduced-motion: reduce){.pick,.bn,.intro{transition:none}}
</style></head><body>
<canvas id="gl"></canvas><div id="nogl">Этому браузеру недоступна 3D-графика (WebGL).</div>
<div class="hud">
  <div class="sb"><div class="tm" id="tA"><b>Вы</b><small id="mA"></small></div><div class="mid"><b id="sA">0</b><div><span id="rn">Раунд 1</span><span class="clk" id="clk">1:55</span><span id="mapn"></span></div><b id="sB">0</b></div><div class="tm r" id="tB"><b id="nB"></b><small id="mB"></small></div></div>
  <div class="rh" id="rh"></div>
  <div class="row" id="rowB"></div>
  <div class="sp"></div>
  <div class="row" id="rowA"></div>
  <div class="ctl"><button class="cb" id="bSpd">×1</button><button class="cb" id="bPause">❚❚</button><button class="cb" id="bSkip">⏭</button><button class="cb" id="bCam" title="Камера">◎</button></div>
</div>
<div class="feed" id="feed"></div>
<div class="bn" id="bn"></div>
<div class="intro" id="intro"><small>Добро пожаловать на</small><b id="introN"></b></div>
<div class="pick" id="pick"></div>

  $('#pick').classList.remove('on'); startRound(cards, { dir: p.dir, tempo: p.tempo, focus: -1 }, p.n);
}

/* ---------- Ход матча ---------- */
let PHASE = 'intro', S = null, LAST = null, RT = 0, EI = 0, SPD = 1, PAUSE = false, WAIT = 0;
function idle() { const fake = { sideA: M.sideA, plan: { dir: 'S', tempo: 'norm' }, planB: { dir: 'S', tempo: 'norm' }, kills: [], end: 'elim', round: M.round }; S = rdScript(fake, MAPN); setTeams(S); placeAll(0); }
function placeAll(t) { for (const d of S.dots) { const p = P3[d.team + d.i]; if (!p) continue; const q = rdPos(d, t); p.g.position.set(X(q[0]), 0, Z(q[1])); p.last = q; } }
function plan() { PHASE = 'plan'; KD = null; idle(); hud(); $('#clk').textContent = '1:55'; $('#clk').className = 'clk'; showPick(); }
function startRound(cards, pl, name) {
  KD = { a: { k: [...M.a.k], d: [...M.a.d] }, b: { k: [...M.b.k], d: [...M.b.d] } };
  LAST = M.play(cards, pl); S = rdScript(LAST, MAPN); setTeams(S); placeAll(0); RT = 0; EI = 0; PHASE = 'round'; hud(); $('#feed').innerHTML = '';
  banner('', name, `Соперник: ${DIRN[LAST.planB.dir]}, ${TEMPON[LAST.planB.tempo]}`, 1800);
  /* гранаты: дым саппорта у входа на точку, молотов защиты — косметика по плану */
  const site = S.site, rt = (LAST.sideA === 'A' ? LAST.plan : LAST.planB), path = rdPts(RM, RM.tr[site][0]), entry = path[path.length - 2];
  UT = [{ t: S.tc - .6, f: () => smoke([lerp(entry[0], RM.n[site][0], .55), lerp(entry[1], RM.n[site][1], .55)], 9) }, { t: S.tc + .4, f: () => fire([lerp(entry[0], RM.n[site][0], .3), lerp(entry[1], RM.n[site][1], .3)], 4.5) }];
  if (rt.dir === 'S') UT.push({ t: S.tc - 1.2, f: () => smoke(RM.n[RM.tr.M[RM.tr.M.length - 1]], 8) });
}
let UT = [];
function event(e) {
  if (e.type === 'kill') { const kd = S.dots.find(d => d.team === (e.k.byA ? 'a' : 'b') && d.i === e.k.k), vd = S.dots.find(d => d.team === (e.k.byA ? 'b' : 'a') && d.i === e.k.v);
    if (kd && vd) tracer(rdPos(kd, e.t), rdPos(vd, e.t), kd.side); feed(e.k);
    const vt = e.k.byA ? 'b' : 'a', kt = e.k.byA ? 'a' : 'b'; KD[kt].k[e.k.k]++; KD[vt].d[e.k.v]++; hud(); const v = $('#pc-' + vt + e.k.v); if (v) v.classList.add('dead'); const kc = $('#pc-' + kt + e.k.k); if (kc) kc.classList.add('hit');
    S.dots.forEach(d => { if (d.dt != null && RT >= d.dt) { const c = $('#pc-' + d.team + d.i); if (c) c.classList.add('dead'); } }); }
  else if (e.type === 'plant') { plantBomb(e.site); $('#clk').textContent = 'C4'; $('#clk').className = 'clk bomb'; banner('', 'Бомба заложена', 'точка ' + e.site, 1400); }
  else if (e.type === 'boom') boom(e.site);
  else if (e.type === 'defuse') { if (bomb) { bomb.led.material.color.set(0x4aa3ff); bomb.def = true; } banner('', 'Бомба обезврежена', '', 1200); }
  else if (e.type === 'time') banner('', 'Время вышло', '', 1200);
}
function endRound() {
  PHASE = 'end'; WAIT = 2.6; const L = LAST; KD = null; hud();
  banner(L.win ? 'w' : 'l', L.win ? 'Раунд ваш' : 'Раунд проигран', `${END[L.end]} · ${esc(L.mvp)} — ${L.ace ? 'эйс' : L.frags + ' фр.'}`, 2400);
}
function next() {
  if (bomb) { scene.remove(bomb.g); bomb = null; } for (const s of ['A', 'B']) siteLight[s].intensity = 0;
  if (M.over) { PHASE = 'over'; banner(M.won ? 'w' : 'l', M.won ? 'Победа' : 'Поражение', `${M.a.score}:${M.b.score} · ${MAPN}`, 1e9); return; }
  if (LAST.swap) banner('', 'Смена сторон', 'деньги сброшены', 1800);
  plan();
}

/* ---------- Кадр ---------- */
let last = performance.now() / 1000, T = 0;
function frame() {
  const now = performance.now() / 1000, rdt = Math.min(.05, now - last); last = now; const dt = PAUSE ? 0 : rdt; T += dt;
  if (PHASE === 'plan' && !PAUSE) { PICK_T -= rdt; const r = $('#rg'); if (r) r.setAttribute('stroke-dashoffset', (100.5 * (1 - Math.max(0, PICK_T) / PICK_D)).toFixed(1)); const n = $('#rgt'); if (n) n.textContent = Math.max(0, Math.ceil(PICK_T)); if (PICK_T <= 0) go(PICK_REC); }
  if (PHASE === 'round') { RT += dt * SPD;
    while (UT.length && UT[0].t <= RT) UT.shift().f();
    while (EI < S.ev.length && S.ev[EI].t <= RT) event(S.ev[EI++]);
    const left = Math.max(0, Math.ceil(115 - RT * 115 / S.T)); if (!bomb) $('#clk').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
    if (RT >= S.T) { while (EI < S.ev.length) event(S.ev[EI++]); endRound(); } }
  else if (PHASE === 'end') { WAIT -= dt * SPD; if (WAIT <= 0) next(); }
  /* игроки: позиция по сценарию, поворот по ходу, смерть — падение */
  if (S) { const t = PHASE === 'round' ? RT : PHASE === 'end' ? S.T : 0;
    for (const d of S.dots) { const p = P3[d.team + d.i]; if (!p) continue; const q = rdPos(d, t), dx = q[0] - (p.last ? p.last[0] : q[0]), dz = q[1] - (p.last ? p.last[1] : q[1]); p.g.position.set(X(q[0]), 0, Z(q[1]));
      if (Math.hypot(dx, dz) > .005) p.ang = Math.atan2(dx, dz); p.fig.rotation.y = damp(p.fig.rotation.y, p.ang, 10, dt); p.last = q;
      const dead = d.dt != null && t >= d.dt; if (dead && !p.dead) { p.dead = true; p.fig.rotation.z = 0; p.ring.material.color.set(0x555555); p.tag.material.opacity = .45; }
      if (p.dead) { p.fig.rotation.x = damp(p.fig.rotation.x, -Math.PI / 2, 9, dt); p.fig.position.y = damp(p.fig.position.y, .35, 9, dt); }
      else p.fig.position.y = Math.abs(Math.sin(T * 9 + d.i)) * .08 * (Math.hypot(dx, dz) > .005 ? 1 : 0);
      const dist = cam.position.distanceTo(p.g.position), sc = dist * (MOB ? .085 : .06); p.tag.scale.set(sc, sc / 2, 1); p.tag.position.y = 2.4 + sc * .25; p.ring.scale.setScalar(Math.max(1, dist / 55)); } }
  if (bomb) { bomb.t += dt; const bl = bomb.def ? .6 : (Math.sin(bomb.t * (6 + bomb.t * .8)) > 0 ? 1 : .1); bomb.led.material.color.setScalar(1); bomb.led.material.color.set(bomb.def ? 0x4aa3ff : 0xff2a1a).multiplyScalar(bl + .2); siteLight[bomb.site].color.set(bomb.def ? 0x4aa3ff : 0xff3b30); siteLight[bomb.site].intensity = bl * 5; }
  flash.intensity = Math.max(0, flash.intensity - rdt * 40);
  for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.t += dt * (PHASE === 'round' ? SPD : 1); const k = Math.min(1, f.t / f.d); f.f(k, T); if (k >= 1) { f.end(); FX.splice(i, 1); } }
  camFrame(rdt, T);
  R3.render(scene, cam);
  requestAnimationFrame(frame);
}
$('#bSpd').onclick = () => { SPD = SPD === 1 ? 2 : SPD === 2 ? 4 : 1; $('#bSpd').textContent = '×' + SPD; };
$('#bPause').onclick = () => { PAUSE = !PAUSE; $('#bPause').textContent = PAUSE ? '▶' : '❚❚'; };
$('#bSkip').onclick = () => { if (PHASE === 'round') RT = S.T - .01; };
$('#bCam').onclick = () => { CAM.d *= 1; };
$('#introN').textContent = MAPN;
hud(); idle(); placeAll(0); CAM.d = 140; CAM.x = 0; CAM.z = 30;
setTimeout(() => { $('#intro').classList.add('out'); plan(); }, reduce ? 200 : 2600);
requestAnimationFrame(frame);
})();
</script></body></html>
