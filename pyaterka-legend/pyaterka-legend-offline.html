<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Пятёрка Легенд</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0e11">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Вид: тактический шутер. Вертикальный экран телефона; за интерфейсом — сцена карты (небо, два слоя построек, дым, пыль),
   камера сдвигается при смене раздела; панели — тёмное стекло со срезанным углом; кейсы, лента редкостей и матч идут полноэкранными слоями */
@property --s1{syntax:'<color>';inherits:true;initial-value:#14181d}
@property --s2{syntax:'<color>';inherits:true;initial-value:#6b4a2a}
@property --s3{syntax:'<color>';inherits:true;initial-value:#0a0b0d}
:root{
  --bg:#0c0e11;--panel:rgb(18 21 26 / .66);--panel2:rgb(255 255 255 / .06);--line:rgb(255 255 255 / .11);--fg:#eef0f3;--mut:#9aa3ae;
  --accent:#f0a93a;--go:#7bc043;--go2:#4f9a23;--on-go:#0c1a04;--bad:#ff6b5e;--good:#7bd65a;--coin:#f2c14e;--sel:#ffd27a;
  --ct:#7fb2ff;--tt:#f0c269;
  --r0:#b0c3d9;--r1:#6c8cff;--r2:#a274ff;--r3:#e45cf2;--r4:#ff5a5a;--sp:#ff8a3d;--gold:#f2c14e;
  --f-d:'Oswald','Roboto Condensed','Arial Narrow',Impact,system-ui,sans-serif;
  --f-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}
h2{font:600 22px/1.1 var(--f-d);letter-spacing:.03em;text-transform:uppercase}
h3,.eyebrow{font:600 12px/1.2 var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.plain{display:flex;flex-direction:column;gap:10px;min-width:0}
.rowb{display:flex;gap:8px;flex-wrap:wrap}.rowb>*{flex:1 1 140px}

/* ---------- Сцена ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--s1:#14181d;--s2:#7a4f26;--s3:#0a0b0d;transition:--s1 .9s,--s2 .9s,--s3 .9s;background:linear-gradient(180deg,var(--s1) 0%,color-mix(in srgb,var(--s1) 55%,var(--s2)) 46%,var(--s2) 62%,var(--s3) 78%)}
#scene[data-s="packs"]{--s1:#0b1114;--s2:#8a5a16;--s3:#060708}
#scene[data-s="col"]{--s1:#0e1622;--s2:#2f5d86;--s3:#07090d}
#scene[data-s="squad"]{--s1:#0e1512;--s2:#4f6a35;--s3:#070907}
#scene .sun{position:absolute;left:50%;top:58%;width:130vmax;height:60vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--s2) 85%,#fff 15%),transparent 70%);opacity:.55}
#scene .pan{position:absolute;left:0;bottom:22%;width:400%;height:38vh;min-height:240px;transition:transform .9s cubic-bezier(.6,0,.2,1);will-change:transform}
#scene .pan.far{bottom:26%;opacity:.55;transition-duration:1.15s}
#scene .pan svg{width:100%;height:100%;display:block}
#scene .beam{position:absolute;top:-10%;width:34vmax;height:120%;background:linear-gradient(180deg,rgb(255 255 255 / .1),transparent 70%);transform-origin:50% 0;filter:blur(14px);mix-blend-mode:screen}
#scene .beam.b1{left:8%;transform:rotate(14deg);animation:sway 11s ease-in-out infinite alternate}
#scene .beam.b2{right:4%;transform:rotate(-18deg);animation:sway 14s ease-in-out infinite alternate-reverse;opacity:.7}
#scene .fog{position:absolute;left:-30%;right:-30%;bottom:8%;height:44%;background:radial-gradient(40% 55% at 22% 60%,rgb(255 255 255 / .1),transparent 70%),radial-gradient(45% 60% at 68% 50%,rgb(255 255 255 / .08),transparent 70%),radial-gradient(30% 50% at 48% 80%,rgb(255 255 255 / .07),transparent 70%);filter:blur(10px);animation:drift 26s linear infinite alternate}
#scene .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,var(--s3),#050607)}
#scene .dust{position:absolute;inset:0}
#scene .dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgb(255 240 210 / .5);animation:mote linear infinite}
#scene .vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgb(0 0 0 / .72)),linear-gradient(180deg,rgb(0 0 0 / .35),transparent 22%)}
@keyframes sway{to{transform:rotate(-6deg)}}
@keyframes drift{to{transform:translateX(12%)}}
@keyframes mote{from{transform:translate3d(0,0,0);opacity:0}15%{opacity:1}to{transform:translate3d(var(--dx),-70vh,0);opacity:0}}

/* ---------- Каркас ---------- */
#hud{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgb(8 9 11 / .92),rgb(8 9 11 / .55) 70%,transparent);padding-top:env(safe-area-inset-top,0px)}
#hud .wrap{display:flex;align-items:center;gap:10px;padding-block:10px 14px}
#hud .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#hud .who b{display:block;font:600 16px/1.1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{flex:none;width:44px;height:30px}
.xp{display:block;height:3px;background:rgb(255 255 255 / .14);margin-top:5px;width:120px;max-width:100%}.xp i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--f-m);padding:8px 10px;background:rgb(0 0 0 / .45);border:1px solid var(--line)}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--coin) 55%,#8a6410);flex:none}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:rgb(0 0 0 / .45);flex:none}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;z-index:1;padding-block:4px 104px;display:flex;flex-direction:column;gap:14px;min-height:70vh}
#app.enter>*{animation:pin .46s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes pin{from{opacity:0;transform:translate3d(calc(var(--dir,1)*36px),0,0)}to{opacity:1;transform:none}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(9 10 12 / .86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:0}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;font:600 10px/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);transition:color .2s}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#tabs button[aria-current]{color:var(--fg)}#tabs button[aria-current]::before{transform:scaleX(1)}
#tabs .dot{position:absolute;top:7px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--accent)}

.pn{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);clip-path:var(--cut);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.pn::before{content:"";position:absolute;left:0;top:0;width:3px;height:26px;background:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;font:600 15px/1.1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;background:rgb(255 255 255 / .09);border:1px solid var(--line);text-align:center;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--go),var(--go2));color:var(--on-go);border-color:transparent;font-weight:700}
.btn.go{min-height:62px;font-size:24px;letter-spacing:.18em;clip-path:var(--cut);box-shadow:0 0 0 1px rgb(255 255 255 / .2) inset}
.btn.s{min-height:38px;font-size:13px}
.btn.dan{background:rgb(255 90 80 / .16);border-color:rgb(255 107 94 / .5);color:#ffb3ab}
.btn:disabled{opacity:.42;cursor:default}
.bar{display:block;height:5px;background:rgb(255 255 255 / .12);overflow:hidden}.bar i{display:block;height:100%;background:var(--rc,var(--accent))}
input[type=text]{width:100%;min-height:44px;padding:10px 12px;font:inherit;color:var(--fg);background:rgb(0 0 0 / .5);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:8px 12px;font:600 12px/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;background:rgb(0 0 0 / .45);border:1px solid var(--line);color:var(--mut);border-bottom:2px solid var(--rc,var(--line))}
.chip[aria-pressed=true]{color:var(--fg);background:rgb(255 255 255 / .14)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px;display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--line)}
.stat b{font:700 22px/1 var(--f-d)}.stat span{font:600 10px/1.2 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.warn{color:#ffb86b;font-size:12px}
.bdg{font:700 10px/1 var(--f-m);padding:3px 6px;text-transform:uppercase;letter-spacing:.06em}.bdg.new{background:var(--go);color:var(--on-go)}.bdg.dup{background:rgb(255 255 255 / .14);color:var(--mut)}

/* ---------- Карточка игрока ---------- */
.pc{--edge:var(--r0);--tc:#888;container-type:inline-size;position:relative;display:block;aspect-ratio:5/7;width:100%;min-width:0;overflow:hidden;isolation:isolate;clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%);background:radial-gradient(130% 62% at 50% 104%,color-mix(in srgb,var(--edge) 62%,transparent),transparent 72%),radial-gradient(80% 46% at 50% 30%,color-mix(in srgb,var(--tc) 34%,transparent),transparent 75%),linear-gradient(180deg,#2b3038,#171a20 55%,#0b0d10);color:#f4f6f8;text-align:left}
.pc.r1{--edge:var(--r1)}.pc.r2{--edge:var(--r2)}.pc.r3{--edge:var(--r3)}.pc.r4{--edge:var(--r4)}.pc.sp1{--edge:var(--sp)}.pc.sp2{--edge:var(--gold)}
.pc::before{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(118deg,rgb(255 255 255 / .045) 0 1.5px,transparent 1.5px 9px);pointer-events:none}
.pc::after{content:"";position:absolute;inset:0;z-index:5;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .13),inset 0 -3px 0 var(--edge);pointer-events:none}
.pc.sp1::before,.pc.sp2::before{background:repeating-linear-gradient(118deg,color-mix(in srgb,var(--edge) 26%,transparent) 0 3px,transparent 3px 11px)}
.pc .sh{position:absolute;inset:-20% -60%;z-index:3;background:linear-gradient(105deg,transparent 42%,rgb(255 255 255 / .3) 50%,transparent 58%);transform:translateX(-60%);pointer-events:none;opacity:0}
.pc.r3 .sh,.pc.r4 .sh,.pc.sp1 .sh,.pc.sp2 .sh{opacity:1;animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.pc .mg{position:absolute;z-index:0;right:-2cqw;top:14cqw;font:700 50cqw/1 var(--f-d);color:rgb(255 255 255 / .06);text-transform:uppercase;pointer-events:none}
.pc .art{position:absolute;z-index:1;left:12%;width:88%;top:15%;height:56%;opacity:.9}
.pc .ph{position:absolute;z-index:1;left:0;top:0;width:100%;height:78%;object-fit:cover;object-position:50% 10%;-webkit-mask-image:linear-gradient(#000 64%,transparent);mask-image:linear-gradient(#000 64%,transparent)}
.pc .hd{position:absolute;z-index:4;left:6cqw;top:5cqw;display:flex;flex-direction:column;align-items:flex-start;gap:1.5cqw}
.pc .ov{font:700 24cqw/1 var(--f-d);text-shadow:0 2px 8px rgb(0 0 0 / .7)}
.pc .rl{font:700 7.4cqw/1 var(--f-m);letter-spacing:.05em;padding:1.6cqw 2.4cqw;background:rgb(5 7 10 / .7);color:var(--edge)}
.pc .rk{position:absolute;z-index:4;right:15cqw;top:4.5cqw;font:700 6.4cqw/1 var(--f-m);color:rgb(255 255 255 / .6)}
.pc .ft{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:16cqw 6cqw 6.5cqw;display:flex;flex-direction:column;gap:.8cqw;background:linear-gradient(transparent,rgb(6 7 9 / .9) 46%)}
.pc .tag{font:700 6cqw/1.2 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--edge)}
.pc .nk{font:600 12.5cqw/1.1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .tm{font-size:7.2cqw;line-height:1.2;color:rgb(255 255 255 / .68);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:2cqw}
.pc .tm::before{content:"";flex:none;width:2.4cqw;height:2.4cqw;background:var(--tc);transform:rotate(45deg)}
.pc .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw 2cqw;margin-top:2cqw;padding-top:2.4cqw;border-top:1px solid rgb(255 255 255 / .18);font:500 5.6cqw/1.2 var(--f-m);color:rgb(255 255 255 / .68)}
.pc .sg b{font-size:7.4cqw;color:#fff;margin-right:1.2cqw}
.pc .lv{display:flex;gap:1.4cqw;margin-top:1.8cqw}.pc .lv i{width:5cqw;height:1.6cqw;background:rgb(255 255 255 / .22)}.pc .lv i.on{background:var(--edge)}
.pc .cnt{position:absolute;z-index:6;right:5cqw;bottom:7cqw;font:700 7cqw/1 var(--f-m);padding:1.6cqw 2.6cqw;background:#f4f6f8;color:#0b0d10}
.pc.no{filter:grayscale(1) brightness(.75);opacity:.55}
.pc.xs .tm,.pc.xs .tag,.pc.xs .lv,.pc.xs .rk,.pc.xs .cnt{display:none}
.pc.xs .nk{font-size:15cqw}.pc.xs .ov{font-size:27cqw}.pc.xs .rl{font-size:10cqw}.pc.xs .ft{padding-bottom:9cqw}

/* ---------- Лобби ---------- */
.lobby{display:flex;flex-direction:column;gap:12px}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end;padding:26px 0 0;position:relative;perspective:700px}
.lineup::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:34px;background:radial-gradient(50% 100% at 50% 0,rgb(0 0 0 / .75),transparent 80%);z-index:-1}
.lineup>button{display:block;filter:drop-shadow(0 14px 14px rgb(0 0 0 / .6))}
.lineup>button:nth-child(1),.lineup>button:nth-child(5){transform:translateY(0) scale(.94)}
.lineup>button:nth-child(3){transform:translateY(-18px) scale(1.08);z-index:2}
.lineup>button:nth-child(2),.lineup>button:nth-child(4){transform:translateY(-9px)}
#app.enter .lineup>button{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}#app.enter .lineup>button:nth-child(2){animation-delay:.06s}#app.enter .lineup>button:nth-child(3){animation-delay:.12s}#app.enter .lineup>button:nth-child(4){animation-delay:.18s}#app.enter .lineup>button:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:600 12px/1.2 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kv b{font:700 17px/1 var(--f-d);color:var(--fg);letter-spacing:.02em}
.shop{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}

/* ---------- Кейс ---------- */
.pk{--kc:#8fa3b8;position:relative;aspect-ratio:10/8;width:100%;filter:drop-shadow(0 12px 12px rgb(0 0 0 / .6))}
.pk.pro{--kc:var(--r2)}.pk.elite{--kc:var(--gold)}
.pk .lid,.pk .box{position:absolute;left:0;right:0;background:linear-gradient(180deg,#4a515c,#262a31);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .18)}
.pk .lid{top:6%;height:34%;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.pk .box{top:40%;bottom:0;background:linear-gradient(180deg,#2e333b,#15181c);display:grid;place-items:center}
.pk .box::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kc)}
.pk .box::after{content:"";position:absolute;left:8%;right:8%;bottom:14%;height:3px;background:repeating-linear-gradient(90deg,var(--kc) 0 8px,transparent 8px 14px);opacity:.7}
.pk .lock{position:absolute;left:50%;top:40%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--kc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:2;transition:transform .4s,opacity .4s}
.pk b{font:700 11px/1 var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:rgb(255 255 255 / .8)}
.pk.open .lid{transform:perspective(300px) rotateX(-62deg)}.pk.open .lock{transform:translate(-50%,160%) rotate(90deg);opacity:0}
.pk.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.odds span{font:700 11px/1 var(--f-m);text-align:center;padding:7px 2px;background:rgb(0 0 0 / .4);border-bottom:2px solid var(--rc)}

/* ---------- Нижний лист ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#over[hidden]{display:none}
#sheet .in{width:100%;max-height:94vh;overflow-y:auto;background:linear-gradient(180deg,#1a1d22,#0e1013);border-top:2px solid var(--accent);padding:16px 0 calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.col{display:flex;flex-direction:column;gap:12px}
.insp{display:grid;place-items:center;padding:6px 0;perspective:800px}
.tilt{width:62%;max-width:250px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s;position:relative;filter:drop-shadow(0 20px 22px rgb(0 0 0 / .7));touch-action:none}
.tilt::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(60% 50% at var(--gx,50%) var(--gy,20%),rgb(255 255 255 / .28),transparent 70%);mix-blend-mode:screen;clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%)}
.attr{display:grid;grid-template-columns:86px 1fr 30px;gap:10px;align-items:center;font-size:13px}.attr b{font:700 13px var(--f-m);text-align:right}
.list{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;background:rgb(255 255 255 / .05);border-left:3px solid var(--rc,var(--line))}
.prow .o{font:700 20px/1 var(--f-d)}

/* ---------- Полноэкранный слой ---------- */
#over{position:fixed;inset:0;z-index:50;background:#07080a;overflow-y:auto;overflow-x:hidden}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.flash{position:fixed;inset:0;z-index:59;background:#fff;pointer-events:none;animation:fl .6s ease-out forwards}
@keyframes fl{from{opacity:.75}to{opacity:0}}
.po{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:calc(16px + env(safe-area-inset-top,0px)) 20px;position:relative;z-index:1}
.po-bg{position:fixed;inset:0;background:radial-gradient(70% 45% at 50% 38%,color-mix(in srgb,var(--gl,#8fa3b8) 30%,transparent),transparent 70%),linear-gradient(180deg,#0d0f12,#050607);transition:--gl .4s}
.po-stage{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:340px}
.po-pk{width:62%;max-width:250px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.scan{--gl:#8fa3b8;position:relative;width:62%;max-width:240px;aspect-ratio:5/7;display:grid;place-items:center}
.scan-fr{position:absolute;inset:0;border:1px solid color-mix(in srgb,var(--gl) 60%,transparent);background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--gl) 12%,transparent) 0 1px,transparent 1px 7px),radial-gradient(60% 50% at 50% 40%,color-mix(in srgb,var(--gl) 28%,transparent),transparent 75%);overflow:hidden;clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%)}
.scan-fr svg{position:absolute;left:10%;top:10%;width:80%;height:62%;opacity:.55;--edge:var(--gl);animation:holo .5s steps(3) infinite}
.scan-fr::before,.scan-fr::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--gl)}
.scan-fr::before{left:6px;bottom:6px;border-right:0;border-top:0}.scan-fr::after{right:6px;bottom:6px;border-left:0;border-top:0}
.scan-ln{position:absolute;left:0;right:0;top:0;height:22%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--gl) 70%,transparent));border-bottom:2px solid var(--gl);animation:sweep .7s ease-in-out infinite alternate}
.scan-tx{position:absolute;left:8%;right:8%;bottom:7%;display:flex;flex-direction:column;gap:3px;font:700 11px/1.2 var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--gl)}
.scan-tx span{animation:kin .16s both;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scan.out{animation:mat .45s cubic-bezier(.2,1.3,.4,1) both}
.scan.glitch .scan-fr{animation:glitch .12s steps(2) infinite}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(360%)}}
@keyframes holo{50%{opacity:.4;transform:translateX(1px)}}
@keyframes mat{from{opacity:0;transform:scale(1.25);filter:blur(8px) brightness(2.4)}}
@keyframes glitch{0%{transform:translate(-4px,2px) skewX(6deg);filter:hue-rotate(40deg)}50%{transform:translate(5px,-3px) skewX(-8deg);filter:hue-rotate(-60deg) brightness(1.6)}100%{transform:none}}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%}
.tray>div{aspect-ratio:5/7;border:1px dashed var(--line);background:rgb(255 255 255 / .03)}
.tray>div.on{border:0;background:none;animation:pop .3s both}
.arena{--tc:#f0a93a;position:fixed;inset:0;z-index:1;overflow:hidden;animation:fadein .6s both}
.arena::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 62%,color-mix(in srgb,var(--tc) 45%,transparent),transparent 72%),linear-gradient(180deg,#040507 0,#0b0d12 55%,#1a1d24 56%,#07080a 100%)}
.arena i{position:absolute;top:-10%;width:26vmax;height:130%;transform-origin:50% 0;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,#fff 20%),transparent 75%);opacity:.35;filter:blur(10px);mix-blend-mode:screen}
.arena i:nth-child(1){left:-4%;animation:spot 2.6s ease-in-out infinite alternate}.arena i:nth-child(2){right:-4%;animation:spot 3.1s ease-in-out infinite alternate-reverse}.arena i:nth-child(3){left:38%;opacity:.2;animation:spot 3.6s ease-in-out infinite alternate}
.arena b{position:absolute;left:0;right:0;bottom:8%;height:30%;background:radial-gradient(40% 60% at 30% 60%,rgb(255 255 255 / .12),transparent 70%),radial-gradient(40% 60% at 70% 50%,rgb(255 255 255 / .1),transparent 70%);filter:blur(12px);animation:drift 9s linear infinite alternate}
.arena.a1::before{background:radial-gradient(60% 40% at 50% 62%,color-mix(in srgb,var(--tc) 45%,transparent),transparent 72%),repeating-linear-gradient(90deg,rgb(120 220 255 / .06) 0 1px,transparent 1px 40px),linear-gradient(180deg,#02060c,#071320 55%,#0e2233 56%,#03070c)}
.arena.a2::before{background:radial-gradient(60% 40% at 50% 62%,color-mix(in srgb,var(--tc) 40%,transparent),transparent 72%),repeating-linear-gradient(135deg,rgb(0 0 0 / .3) 0 14px,transparent 14px 28px),linear-gradient(180deg,#0a0705,#15100b 55%,#241a10 56%,#080604)}
.arena.a3::before{background:radial-gradient(70% 45% at 50% 60%,color-mix(in srgb,var(--tc) 50%,#fff 8%),transparent 72%),radial-gradient(2px 2px at 20% 20%,#fff,transparent),radial-gradient(2px 2px at 70% 12%,#fff,transparent),radial-gradient(2px 2px at 85% 30%,#fff,transparent),radial-gradient(2px 2px at 40% 8%,#fff,transparent),linear-gradient(180deg,#05040a,#100c1c 55%,#1c1730 56%,#06050b)}
@keyframes spot{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@keyframes fadein{from{opacity:0}}
.rare-t{position:relative;z-index:2;font:700 26px/1.15 var(--f-d);letter-spacing:.16em;text-transform:uppercase;text-align:center;color:var(--gl);text-shadow:0 0 24px var(--gl);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.walk{position:relative;z-index:2;width:66%;max-width:260px;animation:walk 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 24px 30px rgb(0 0 0 / .8))}
@keyframes walk{from{opacity:0;transform:translateY(60px) scale(.7);filter:brightness(0)}60%{filter:brightness(.6)}}
.po-name{min-height:44px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.po-name b{font:700 22px/1.1 var(--f-d);letter-spacing:.06em;text-transform:uppercase}
.big{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* ---------- Матч ---------- */
.mt{--mh:38;min-height:100vh;position:relative;display:flex;flex-direction:column}
.mt-bg{position:fixed;inset:0;background:radial-gradient(90% 50% at 50% 42%,hsl(var(--mh) 45% 30% / .55),transparent 72%),repeating-linear-gradient(0deg,rgb(255 255 255 / .025) 0 1px,transparent 1px 34px),repeating-linear-gradient(90deg,rgb(255 255 255 / .025) 0 1px,transparent 1px 34px),linear-gradient(180deg,#0b0d10,#050607)}
.mt-in{position:relative;z-index:1;flex:1;width:100%;display:flex;flex-direction:column;gap:8px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px))}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}

.vs{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.vs .x{font:700 22px/1 var(--f-d);color:var(--accent);letter-spacing:.2em}
.vs .grid{width:100%;animation:pin .5s .2s both}
.vs .grid.op{--dir:-1}
.maps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.map{position:relative;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;padding:8px;text-align:left;background:linear-gradient(180deg,hsl(var(--h) 40% 34%),hsl(var(--h) 45% 12%));border:1px solid var(--line);overflow:hidden;transition:opacity .4s,filter .4s,transform .3s}
.map::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgb(0 0 0 / .16) 0 10px,transparent 10px 22px),radial-gradient(60% 40% at 70% 20%,rgb(255 255 255 / .25),transparent 70%)}
.map b{position:relative;font:700 18px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase}
.map span{position:relative;font-size:11px;line-height:1.2;color:rgb(255 255 255 / .75)}
.map.ban{opacity:.3;filter:grayscale(1)}.map.ban::after{content:"БАН";position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--f-d);letter-spacing:.2em;color:var(--bad);transform:rotate(-14deg)}
.map.pick{transform:scale(1.04);border-color:var(--go);box-shadow:0 0 24px -4px var(--go)}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:rgb(10 11 13 / .85);border:1px solid var(--line)}
.sbar .t{padding:7px 10px;min-width:0;border-bottom:3px solid var(--sc)}
.sbar .t.r{text-align:right}
.sbar .t b{display:block;font:600 15px/1.1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbar .t span{display:block;font:700 10.5px/1.3 var(--f-m);color:var(--sc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .c{display:flex;align-items:center;gap:10px;padding:0 12px;background:rgb(0 0 0 / .5)}
.sbar .c b{font:700 32px/1 var(--f-d);min-width:24px;text-align:center}
.sbar .c div{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10px/1.1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sd-D{--sc:var(--ct)}.sd-A{--sc:var(--tt)}
.hist{display:flex;gap:2px;align-items:center}
.hist i{flex:1;height:5px;background:rgb(255 255 255 / .1)}.hist i.w{background:var(--go)}.hist i.l{background:var(--bad)}.hist i.h{flex:none;width:6px;height:9px;background:none;border-inline:1px solid var(--mut)}
.trow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.chipp{position:relative;display:flex;flex-direction:column;gap:2px;transition:opacity .25s,filter .25s,transform .25s}
.chipp .f{position:relative;aspect-ratio:1;overflow:hidden;background:linear-gradient(180deg,#30353d,#14171b);border-bottom:3px solid var(--sc)}
.chipp .f img,.chipp .f svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.chipp .f svg{left:8%;top:10%;width:92%;height:92%}
.chipp .n{font:600 11px/1.1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chipp .k{position:absolute;right:2px;top:2px;font:700 10px/1 var(--f-m);padding:2px 3px;background:rgb(0 0 0 / .7)}
.chipp.dead{opacity:.34;filter:grayscale(1)}.chipp.dead .f::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--bad) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,var(--bad) 46% 54%,transparent 54%)}
.chipp.hit{animation:hitk .3s}
@keyframes hitk{30%{transform:scale(1.12);filter:brightness(1.8)}}
.mid{flex:1;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:104px;border-block:1px solid var(--line);background:rgb(0 0 0 / .3);overflow:hidden}
.feed{display:flex;flex-direction:column;gap:3px;align-items:flex-end;padding:6px 8px}
.feed div{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--f-d);letter-spacing:.03em;text-transform:uppercase;padding:4px 7px;background:rgb(0 0 0 / .62);border:1px solid rgb(255 255 255 / .1);animation:kin .22s both;max-width:100%}
.feed div.me{border-color:var(--bad)}
.feed .ka{color:var(--ka)}.feed .va{color:var(--vc)}
.feed svg{width:22px;height:10px;flex:none;fill:#e9ebee}
.feed .hs{width:9px;height:9px;border:2px solid #e9ebee;border-radius:50%;flex:none}
@keyframes kin{from{opacity:0;transform:translateX(24px)}}
.played{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;font:600 10px/1.2 var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.played span:last-child{text-align:right}
.played b{color:var(--fg);font-weight:600}
.banner{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:rgb(6 7 9 / .93);animation:bn .28s both;padding:0 12px}
.banner b{font:700 26px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase}
.banner.w b{color:var(--go)}.banner.l b{color:var(--bad)}.banner.n b{color:var(--accent)}
.banner span{font:600 12px/1.2 var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
@keyframes bn{from{opacity:0;transform:scaleY(.4)}}
.phase{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:600 11px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}

.en{display:flex;gap:3px;align-items:center}
.en i{flex:1;height:8px;background:rgb(255 255 255 / .12);transform:skewX(-18deg)}.en i.on{background:var(--accent)}.en i.use{background:rgb(240 169 58 / .35)}
.en span{font:700 12px/1 var(--f-m);color:var(--accent);min-width:34px;text-align:right}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ac{position:relative;display:flex;flex-direction:column;gap:3px;min-height:74px;padding:8px 9px;background:rgb(22 25 30 / .92);border:1px solid var(--line);border-left:3px solid var(--mut);transition:transform .12s,border-color .12s,background .12s}

.ac[aria-pressed=true]{border-color:var(--go);border-left-color:var(--go);background:rgb(60 100 30 / .5);transform:translateY(-2px)}
.ac.dis{opacity:.4}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:600 10px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:right;padding:4px 6px}

.res-t{font:700 44px/1 var(--f-d);letter-spacing:.14em;text-transform:uppercase;text-align:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.res-t.w{color:var(--go)}.res-t.l{color:var(--bad)}
/* ---------- Редкости: свой фон и рамка; пятый уровень — золото ---------- */
.pc.r1::before{background:repeating-linear-gradient(118deg,color-mix(in srgb,var(--edge) 12%,transparent) 0 2px,transparent 2px 10px)}
.pc.r2::before{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--edge) 13%,transparent) 0 1px,transparent 1px 9px),repeating-linear-gradient(90deg,color-mix(in srgb,var(--edge) 13%,transparent) 0 1px,transparent 1px 9px)}

.pc.r2::after{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--edge) 55%,transparent),inset 0 -3px 0 var(--edge)}

.pc.l5::after{box-shadow:inset 0 0 0 2px var(--gold),inset 0 -4px 0 var(--gold),inset 0 0 22px -6px var(--gold)}
.pc.l5 .ov{color:var(--gold)}.pc.l5 .lv i.on{background:var(--gold)}
.pc .arc{position:absolute;z-index:4;right:5cqw;top:14cqw;font:700 5.6cqw/1 var(--f-m);padding:1.4cqw 2cqw;background:rgb(5 7 10 / .75);color:rgb(255 255 255 / .75);letter-spacing:.06em}

/* ---------- Общие элементы новых экранов ---------- */
.seg{display:flex;gap:2px;background:rgb(0 0 0 / .45);border:1px solid var(--line);padding:2px}
.seg button{flex:1;min-height:34px;padding:6px 4px;font:600 12px/1.1 var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:center;position:relative}

.seg .dot{position:absolute;top:4px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
select{width:100%;min-height:40px;padding:6px 8px;font:inherit;font-size:13px;color:var(--fg);background:rgb(0 0 0 / .55);border:1px solid var(--line)}

.steps{display:flex;flex-direction:column;gap:6px}.steps div{display:flex;gap:10px;align-items:center;font-size:14px}
.steps i{flex:none;width:22px;height:22px;display:grid;place-items:center;font:700 12px/1 var(--f-m);font-style:normal;border:1px solid var(--line)}.steps .ok i{background:var(--go);color:var(--on-go);border-color:transparent}.steps .now{color:var(--fg)}.steps div:not(.now):not(.ok){color:var(--mut)}

.ab{padding:8px 10px;background:rgb(255 255 255 / .05);border-left:3px solid var(--rc,var(--accent));font-size:13px;line-height:1.35}.ab b{display:block;font:600 14px/1.2 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px}
.cmp .v{font:700 15px/1 var(--f-m);text-align:center}.cmp .v.hi{color:var(--good)}.cmp .k{font:600 10px/1.2 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:center}

.sqtab b{font:700 18px/1 var(--f-d)}.sqtab span{font:600 10px/1.2 var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.slot.empty{border-left-color:var(--bad)}.slot .ph0{aspect-ratio:5/7;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mut);font:700 20px var(--f-d)}
.cap{display:inline-block;font:700 9px/1 var(--f-m);padding:3px 5px;background:var(--accent);color:#1a1000;letter-spacing:.06em;vertical-align:middle}
.tu-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;background:rgb(255 255 255 / .05)}
.cnt-b{display:flex;align-items:center;gap:6px}.cnt-b button{width:32px;height:32px;border:1px solid var(--line);font:700 16px/1 var(--f-m);text-align:center}.cnt-b button:disabled{opacity:.3}
/* ---------- План на раунд и мини-карта ---------- */
.plan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.plan .seg button{min-height:30px;font-size:11px;padding:4px 2px}
.mm{position:absolute;inset:0;display:grid;grid-template-columns:1fr .8fr 1fr;gap:4px;padding:4px;opacity:.9;pointer-events:none}
.mm div{position:relative;border:1px solid rgb(255 255 255 / .1);background:rgb(255 255 255 / .03);display:flex;align-items:flex-start;justify-content:center;padding-top:2px;font:700 22px/1 var(--f-d);color:rgb(255 255 255 / .1);transition:background .3s,border-color .3s}
.mm div.me{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 16%,transparent);color:color-mix(in srgb,var(--mc) 55%,transparent)}
.mm div.op{box-shadow:inset 0 0 0 2px var(--oc)}
.mm div.me.op{background:color-mix(in srgb,var(--bad) 22%,transparent)}
.chipp.foc .f{box-shadow:0 0 0 2px var(--accent)}.chipp.foc .n{color:var(--accent)}
.trow.mine .chipp{cursor:pointer}
.feed{position:relative;z-index:1}.played{position:relative;z-index:1}
.arena-m{flex:1;display:flex;flex-direction:column;gap:6px;min-height:240px}
.rep li{font-size:13px;line-height:1.4;margin:0 0 4px 16px}
.rep ul{margin:0;padding:0}
@media (min-width:700px){.wrap{max-width:680px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.hand{grid-template-columns:repeat(4,minmax(0,1fr))}.frow{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1100px){.wrap{max-width:860px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

  ${info ? '<button class="btn pri go" data-act="fight">Играть</button>' : '<button class="btn go" data-act="goSquad">Соберите пятёрку</button>'}
  ${info ? `<div class="stats"><div class="stat"><b>${info.atk.toFixed(1)}</b><span>атака</span></div><div class="stat"><b>${info.def.toFixed(1)}</b><span>защита</span></div><div class="stat"><b>${info.chem}/13</b><span>химия</span></div></div>` : ''}</section>
  <section class="pn"><div class="kv"><span>Лига «${LEAGUES[lg][0]}»</span><span>Кубки <b>${G.tro}</b></span></div><span class="bar"><i style="width:${prog}%"></i></span><p class="sm mut">${nx ? `До лиги «${nx[0]}» ещё ${nx[1] - G.tro} кубков.` : 'Высшая лига достигнута.'}</p>${low ? `<p class="warn">До понижения в лигу «${LEAGUES[lg - 1][0]}» осталось ${G.tro - LEAGUES[lg][1] + 1} кубков.</p>` : ''}</section>
  <section class="pn"><div class="kv"><span>Серия ежедневных входов</span><b>День ${streak.day} / 28</b></div><span class="bar"><i style="width:${streak.day / 28 * 100}%"></i></span><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px">${streakCells}</div><p class="sm mut" style="margin-top:10px">${streakReward ? 'Сегодня получено: ' + esc(streakReward) : 'Заходите каждый календарный день по Москве — пропуск сбрасывает серию.'}</p><p class="sm mut">Большие награды: день 7 — базовый кейс + 150 монет; 14 — кейс «Про» + 200; 21 — кейс «Про» + 250; 28 — элитный кейс + 400.</p></section>
  ${st === 3 ? tasksH() : ''}
  <section class="pn"><div class="shop">${pkH('basic')}<div class="plain"><h3>Бесплатный кейс</h3>${dailyReady(G, now()) ? '<button class="btn" data-act="daily">Забрать</button>' : '<p class="sm mut">Следующий — после 00:00 по Москве.</p>'}${packCount() ? `<button class="btn s" data-act="tab" data-v="packs">Неоткрытых кейсов: ${packCount()}</button>` : ''}</div></div></section>`;
}

/* ---------- Матчи ---------- */
function lbH() {
  const t = lbTable(G, lbScope, now()), row = x => `<div class="lb ${x.me ? 'me' : ''}"><b>${x.place}</b><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span><b>${x.tro}</b></div>`;
  return `<section class="pn"><h3>Таблица лидеров</h3>${segH('lb', lbScope, [['all', 'Общая'], ['lg', 'Моя лига']])}<div>${t.top.map(row).join('')}${t.me.place > 10 ? '<div class="lb"><span></span><span class="mut">…</span><span></span></div>' + row(t.me) : ''}</div><p class="sm mut">Мест в таблице: ${t.total}. Пока у игры нет сервера, соперники в таблице — боты.</p></section>`;
}
function sqTabsH() {
  return `<div class="sqtab">${G.squads.map((s, i) => { const inf = squadInfo(s.map(id => id == null ? null : { c: CARDS[id], lv: G.cards[id].lv })); return `<button data-act="sq" data-v="${i}" aria-pressed="${G.sqi === i}"><span>Пятёрка ${i + 1}</span><b>${inf ? inf.rating.toFixed(1) : '—'}</b><span>${inf ? 'химия ' + inf.chem + (G.capts[i] != null ? ' · капитан' : ' · без капитана') : 'не собрана'}</span></button>`; }).join('')}</div>`;
}
function vPlay() {
  const info = squadInfo(squadOf(G)), cs = captSlot(G), h = G.season.hist;
  return `<section class="plain"><h3>Состав на матч</h3>${sqTabsH()}<p class="sm mut">${info ? (cs >= 0 ? `Капитан: ${esc(CARDS[G.squad[cs]].nick)}. Он даёт разведку и стартовый импульс 3.` : 'Капитан не назначен: нет разведки, стартовый импульс 2.') : 'В этой пятёрке есть пустые слоты.'}</p>
  ${info ? '<button class="btn pri go" data-act="fight">Играть</button>' : '<button class="btn go" data-act="goSquad">Соберите пятёрку</button>'}<p class="sm mut">Рейтинговый матч до 13 побед. Победа: +40 монет и +25 кубков, с разницей больше 5 раундов +30. Поражение: +10 монет и −25 кубков, при 0:13 −30.</p></section>
  ${G.tut === 3 ? lbH() + `<section class="pn"><h3>Сезон «${monthName(G.season.m)}»</h3><p class="sm mut">Сезон длится месяц. В конце выдаются монеты и кейсы по лиге, а часть кубков сбрасывается: чем выше лига, тем больше.</p>${h.length ? '<div class="list">' + h.slice(0, 3).map(x => `<div class="prow" style="--rc:${LCOL[x.lg]}"><span>${rankH(x.lg)}</span><span><b>${monthName(x.m)}</b><span class="sm mut" style="display:block">лига «${LEAGUES[x.lg][0]}», ${x.tro} кубков</span></span><span class="num">#${x.place}</span></div>`).join('') + '</div>' : '<p class="sm mut">Завершённых сезонов пока нет.</p>'}</section>` : ''}`;
}

/* ---------- Кейсы ---------- */
function vPacks() {
  const inv = Object.keys(PACKS).filter(k => G.packs[k] > 0);
  return `${dailyReady(G, now()) ? `<section class="pn"><div class="shop">${pkH('basic')}<div class="plain"><h3>Бесплатный кейс</h3><button class="btn pri" data-act="daily">Забрать</button></div></div></section>` : ''}
  ${inv.length ? `<section class="plain"><h3>Ваши кейсы</h3>${inv.map(k => `<div class="pn"><div class="shop">${pkH(k)}<div class="plain"><h2>${PACKS[k].n} <span class="num mut" style="font-size:15px">×${G.packs[k]}</span></h2><button class="btn pri" data-act="open" data-v="${k}">Открыть</button></div></div></div>`).join('')}</section>` : ''}
  <section class="plain"><h3>Магазин</h3>${Object.keys(PACKS).map(k => { const P = PACKS[k]; return `<div class="pn"><div class="shop">${pkH(k)}<div class="plain"><h2>${P.n}</h2><p class="sm mut">${P.d}</p><div class="pill" style="align-self:flex-start"><i class="coin"></i>${nf(P.price)}</div></div></div><div class="odds">${P.odds.map((o, i) => `<span style="--rc:var(--r${i})">${o}%</span>`).join('')}</div><button class="btn" data-act="buy" data-v="${k}" ${G.coins < P.price ? 'disabled' : ''}>${G.coins < P.price ? 'Не хватает монет' : 'Купить и открыть'}</button></div>`; }).join('')}</section>
  <p class="sm mut">В кейсе пять карточек. Проценты показывают шанс редкости каждой из них: ${RAR.map(x => x.toLowerCase()).join(', ')}. Внутри редкости реже выпадают игроки с высоким рейтингом и из команд выше в таблице. С шансом 7% вместо обычной версии выпадает «${SPN[1]}» (+3 к рейтингу), с шансом 12% вместо высшей редкости выпадает «${SPN[2]}».</p>`;
}

/* ---------- Коллекция: карточки, составы, контракты ---------- */
function colList() {
  const q = F.q.trim().toLowerCase();
  const l = ALL.filter(c => (F.rar === 'all' || c.rar === +F.rar) && (F.role === 'all' || c.role === +F.role) && (F.team === 'all' || c.team === F.team)
    && (F.own === 'all' || (F.own === 'mine' ? own(c.id) : F.own === 'sp' ? c.sp : F.own === 'hist' ? c.hist : !own(c.id))) && (!q || c.nick.toLowerCase().includes(q)));
  const lv = c => own(c.id) ? own(c.id).lv : 0;
  return F.sort === 'lv' ? l.sort((a, b) => lv(b) - lv(a) || b.ovr - a.ovr) : F.sort === 'low' ? l.slice().reverse() : l;
}
function colGrid() {
  const l = colList();
  return `<p class="sm mut">Найдено: ${l.length}</p><div class="grid">${l.slice(0, colN).map(c => `<button data-act="card" data-id="${c.id}" aria-label="${esc(c.nick)}">${ownH(c.id)}</button>`).join('')}</div>${l.length > colN ? '<button class="btn" data-act="more">Показать ещё</button>' : ''}`;
}
const selH = (k, opts, label) => `<select data-f="${k}" aria-label="${label}">${opts.map(([v, n]) => `<option value="${esc(v)}" ${String(F[k]) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
function vCards() {
  const have = Object.keys(G.cards).length, teams = [...new Set(ALL.map(c => c.team))].sort((a, b) => a.localeCompare(b));
  return `<section class="pn"><div class="kv"><span>Собрано</span><span><b>${have}</b> из ${ALL.length}</span></div><span class="bar"><i style="width:${have / ALL.length * 100}%"></i></span></section>
  <input type="text" id="col-q" placeholder="Поиск по нику" value="${esc(F.q)}" aria-label="Поиск по нику">
  <div class="frow">${selH('rar', [['all', 'Любая редкость']].concat(RAR.map((n, i) => [i, n])), 'Редкость')}${selH('role', [['all', 'Любая роль и способность']].concat(RNAME.map((n, i) => [i, n + ' — «' + AB_BASE[i].n + '»'])), 'Роль и способность')}${selH('team', [['all', 'Любая команда']].concat(teams.map(t => [t, t])), 'Команда')}${selH('sort', [['ovr', 'Сначала сильные'], ['low', 'Сначала слабые'], ['lv', 'По уровню прокачки']], 'Сортировка')}</div>
  ${segH('fown', F.own, [['all', 'Все'], ['mine', 'Мои'], ['none', 'Нет'], ['sp', 'Особые'], ['hist', 'Архив']])}
  <div class="plain" id="col-grid">${colGrid()}</div>`;
}
function vSquads() {
  const sq = squadOf(G), info = squadInfo(sq), rec = bestCapt(G), cap = G.capts[G.sqi], igls = G.squad.filter(id => id != null && CARDS[id].role === 4);
  const mates = id => G.squad.filter(x => x != null && x !== id && CARDS[x].team === CARDS[id].team).length;
  return `${sqTabsH()}
  ${info ? `<div class="stats"><div class="stat"><b>${info.rating.toFixed(1)}</b><span>рейтинг</span></div><div class="stat"><b>${info.atk.toFixed(1)}</b><span>сила в атаке</span></div><div class="stat"><b>${info.def.toFixed(1)}</b><span>сила в защите</span></div></div>` : '<div class="note">В пятёрке есть пустые слоты. Заполните их, чтобы играть.</div>'}
  <section class="plain">${G.squad.map((id, i) => { if (id == null) return `<button class="slot empty" data-act="slot" data-v="${i}"><span><div class="ph0">+</div></span><span><span class="eyebrow">${RNAME[i]}</span><b style="display:block;font:600 17px/1.2 var(--f-d);text-transform:uppercase">Слот пуст</b></span><span class="sm mut">Выбрать</span></button>`;
    const c = CARDS[id], off = c.role !== i, m = mates(id); return `<button class="slot" data-act="slot" data-v="${i}"><span>${ownH(id, 'xs')}</span><span style="min-width:0"><span class="eyebrow">${RNAME[i]}</span><b style="display:block;font:600 19px/1.1 var(--f-d);text-transform:uppercase;overflow-wrap:anywhere">${esc(c.nick)} ${cap === id ? '<span class="cap">капитан</span>' : ''}</b><span class="sm mut">${esc(c.team)} · ${m ? 'партнёров по команде: ' + m : 'без партнёров по команде'}</span><span class="${off ? 'warn' : 'sm mut'}" style="display:block">${off ? 'Не своя роль: −5 ко всем показателям, способности отключены' : '«' + AB_BASE[c.role].n + '» и «' + indOf(c).n + '»'}</span></span><span class="sm mut">Сменить</span></button>`; }).join('')}</section>
  <section class="pn"><h3>Капитан</h3><p class="sm mut">Капитаном может быть только игрок с естественной ролью «Капитан». Он даёт разведку, усиливает «Тайм-аут» и добавляет стартовый импульс.</p>${igls.length ? '<div class="list">' + igls.map(id => `<div class="prow" style="--rc:${glow(CARDS[id])}"><span class="o">${CARDS[id].st.igl + own(id).lv - 1}</span><span><b>${esc(CARDS[id].nick)}</b>${id === rec ? ' <span class="sm" style="color:var(--good)">рекомендуем</span>' : ''}<span class="sm mut" style="display:block">тактика · ${esc(CARDS[id].team)}</span></span>${cap === id ? '<span class="cap">капитан</span>' : `<button class="btn s" data-act="capt" data-id="${id}">Назначить</button>`}</div>`).join('') + '</div>' : '<p class="warn">В пятёрке нет игрока с ролью «Капитан».</p>'}${cap != null ? '<button class="btn s" data-act="capt" data-id="">Играть без капитана</button>' : ''}</section>
  ${info ? `<section class="pn"><h3>Химия ${info.chem} из 13</h3><p class="sm mut">Игроков из одной команды: ${info.mx}. Два дают +2, три +4, четыре +7, пять +10. ${info.onRole ? 'Все на своих ролях: +3.' : 'Если все пятеро на своих ролях, добавится ещё +3.'} Каждые 4 очка химии дают +1 к силе состава. Химия не растёт от числа матчей.</p></section>` : ''}
  <button class="btn" data-act="auto">Собрать лучший состав</button>
  <section class="pn"><h3>Тактические приказы</h3>${DECK.map(k => `<p class="sm"><b>${AC[k].n}</b> <span class="num mut">${AC[k].cost}</span> <span class="mut">— ${AC[k].d}</span></p>`).join('')}</section>`;
}
function vTu() {
  const inf = tuInfo(G, tuSel), cnt = id => tuSel.filter(x => x === id).length;
  const l = Object.keys(G.cards).map(id => CARDS[id]).filter(c => !c.sp && c.rar === tuRar).sort((a, b) => a.ovr - b.ovr);
  const risky = [...new Set(tuSel)].filter(id => own(id) && cnt(id) >= own(id).n && inSquads(G, id));
  return `<section class="pn"><h3>Контракт</h3><p class="sm mut">Десять обычных карточек одной редкости обмениваются на одну. Выпадет либо карточка следующей редкости, либо карточка той же редкости с рейтингом не ниже среднего по вложенным. Чем выше средний рейтинг, тем вероятнее следующая редкость.</p>
  ${segH('turar', String(tuRar), RAR.map((n, i) => [String(i), n.slice(0, 5) + (n.length > 5 ? '.' : '')]))}
  <div class="kv"><span>Выбрано</span><span><b>${tuSel.length}</b> из 10</span></div><span class="bar"><i style="width:${tuSel.length * 10}%"></i></span>
  ${tuSel.length ? `<div class="grid g5">${tuSel.map(id => cardH(CARDS[id], { cls: 'xs' })).join('')}</div>` : ''}
  ${inf.avg ? `<p class="sm">Средний рейтинг: <b class="num">${inf.avg.toFixed(1)}</b>${inf.up ? ` · следующая редкость: примерно <b>${inf.up}</b> · та же редкость сильнее: примерно <b>${inf.same}</b>` : ''}</p>` : ''}
  ${inf.why ? `<p class="${tuRar === 4 ? 'warn' : 'sm mut'}">${inf.why}</p>` : ''}${risky.length ? `<p class="warn">В контракт уйдёт последняя копия игрока из состава: ${risky.map(id => esc(CARDS[id].nick)).join(', ')}.</p>` : ''}
  <div class="rowb"><button class="btn s" data-act="tuFill" ${tuRar === 4 ? 'disabled' : ''}>Добавить слабейшие дубликаты</button><button class="btn s" data-act="tuClear" ${tuSel.length ? '' : 'disabled'}>Очистить</button></div>
  <button class="btn pri" data-act="tuGo" ${inf.ok ? '' : 'disabled'}>Исполнить контракт — отменить нельзя</button></section>
  <section class="list">${l.length ? l.map(c => { const o = own(c.id), n = cnt(c.id); return `<div class="tu-row"><span class="num" style="font-weight:700;color:${glow(c)}">${c.ovr}</span><span style="min-width:0"><b>${esc(c.nick)}</b><span class="sm mut" style="display:block">${RN[c.role]} · ${esc(c.team)} · копий ${o.n}${o.lv > 1 ? ' · ур. ' + o.lv : ''}</span></span><span class="cnt-b"><button data-act="tuDel" data-id="${c.id}" ${n ? '' : 'disabled'} aria-label="Убрать">−</button><span class="num">${n}</span><button data-act="tuAdd" data-id="${c.id}" ${n < o.n && tuSel.length < 10 ? '' : 'disabled'} aria-label="Добавить">+</button></span></div>`; }).join('') : '<p class="sm mut">Обычных карточек этой редкости у вас нет.</p>'}</section>`;
}
function vCol() {
  const body = sub === 'squads' ? vSquads() : sub === 'tu' ? vTu() : vCards();
  return `${segH('sub', sub, [['cards', 'Карточки'], ['squads', 'Составы'], ['tu', 'Контракты']])}${body}`;
}

/* ---------- Профиль ---------- */
function vProf() {
  const lg = leagueOf(G.tro), fr = G.frame, h = G.season.hist, n = G.w + G.l;
  return `<section class="pn" style="${fr >= 0 ? `box-shadow:inset 0 0 0 2px ${LCOL[fr]}` : ''}"><div class="kv"><span>Профиль</span><span>${fr >= 0 ? `рамка сезона: «${LEAGUES[fr][0]}»` : 'рамка сезона появится после первого сезона'}</span></div>
  <div class="stats"><div class="stat"><b>${G.lvl}</b><span>уровень</span></div><div class="stat"><b>${G.tro}</b><span>кубки, лучший ${G.best}</span></div><div class="stat"><b>${n ? Math.round(G.w / n * 100) + '%' : '—'}</b><span>побед: ${G.w} из ${n}</span></div></div></section>
  <section class="pn"><h3>История сезонов</h3>${h.length ? '<div class="list">' + h.map(x => `<div class="prow" style="--rc:${LCOL[x.lg]}"><span>${rankH(x.lg)}</span><span><b>${monthName(x.m)}</b><span class="sm mut" style="display:block">лига «${LEAGUES[x.lg][0]}», ${x.tro} кубков</span></span><span class="num">#${x.place}</span></div>`).join('') + '</div>' : '<p class="sm mut">Завершённых сезонов пока нет. Текущий: «' + monthName(G.season.m) + '».</p>'}</section>
  <section class="pn"><h3>Звук</h3>${segH('snd', snd, [['off', 'Выключен'], ['min', 'Минимум'], ['full', 'Полный']])}<p class="sm mut">Минимум — только сигналы кейсов и итогов раунда. Полный добавляет щелчки, сканер и выстрелы.</p></section>
  <section class="pn"><h3>Об игре</h3><p class="sm mut">Составы команд взяты из рейтинга Valve от 2 ноября 2026. Показатели карточек пока рассчитаны игрой, это не статистика HLTV. Фото игроков берутся из папки photos рядом с файлом игры: имя файла — ник маленькими буквами, например zywoo.png. Прогресс хранится в этом браузере.</p>
  ${askNew ? '<p class="sm">Коллекция и прогресс будут удалены, копия сохранения останется в памяти браузера. Начать заново?</p><div class="rowb"><button class="btn dan s" data-act="newYes">Да, начать заново</button><button class="btn s" data-act="newNo">Отмена</button></div>' : '<button class="btn s" data-act="newAsk">Начать заново</button>'}</section>`;
}

/* ---------- Нижний лист: карточка, выбор в слот, сравнение ---------- */
function abH(c, lv) {
  const pw = Math.round(abPow(c, lv) * 100), i = indOf(c);
  return `<div class="ab" style="--rc:${glow(c)}"><b>${AB_BASE[c.role].n} <span class="num mut" style="font-size:12px">${pw}%</span></b>${AB_BASE[c.role].d} Работает только на роли «${RNAME[c.role]}».</div><div class="ab"><b>${i.n} <span class="num mut" style="font-size:12px">${pw}%</span></b>${i.d}${IND[c.nick] ? '' : ' Индивидуальная способность появится после загрузки статистики HLTV.'}</div>`;
}
function vSheet() {
  if (!sheet) return '';
  if (sheet.t === 'slot') {
    const i = sheet.slot, used = new Set(G.squad.filter((x, k) => k !== i && x != null).map(id => CARDS[id].nick));

/* ---------- Сцена за интерфейсом ---------- */
function buildScene() {
  const mk = (seed, far) => {
    let s = seed, p = '', w2 = ''; const r = () => (s = s * 16807 % 2147483647) / 2147483647;
    for (let d = 0; d < 4; d++) {
      let x = d * 500 - 20; const end = d * 500 + 500;
      while (x < end) {
        const w = 34 + r() * 70, h = (far ? 110 : 46) + r() * (far ? 150 : 110), y = 300 - h;
        if (d === 0) { p += `M${x} 300V${y}h${w}V300z`; if (r() < .4) p += `M${x + w * .2} ${y}a${w * .3} ${w * .3} 0 0 1 ${w * .6} 0z`; if (!far && r() < .6) w2 += `M${x + w * .3} ${y + 14}h${w * .16}v${w * .3}h-${w * .16}z`; }
        else if (d === 1) { const n = 1 + Math.floor(r() * (far ? 5 : 3)); for (let k = 0; k < n; k++) p += `M${x + k % 2 * 8} ${300 - k * 34}v-32h${w + 24}v32z`; if (r() < .22) p += `M${x + 10} 300V${30 + r() * 40}h6V300zM${x - 50} 46h140v6h-140z`; x += 26; }
        else if (d === 2) { p += `M${x} 300V${y + w / 2}a${w / 2} ${w / 2} 0 0 1 ${w} 0V300z`; if (r() < .5) p += `M${x + w - 2} ${y + 70}h46v9h-46z`; }
        else { p += `M${x} 300V${y}h${w}V300z`; if (r() < .5) { const a = 30 + r() * 60; p += `M${x + w / 2 - 2} ${y}v-${a}h4v${a}z`; } if (!far && r() < .5) w2 += `M${x + 8} ${y + 10}h${w - 16}v4h-${w - 16}z`; }
        x += w + 4 + r() * 22;
      }
    }
    return `<svg viewBox="0 0 2000 300" preserveAspectRatio="none" aria-hidden="true"><path d="${p}" fill="${far ? '#232a33' : '#0a0c0f'}"/><path d="${w2}" fill="#f0a93a" opacity=".5"/></svg>`;
  };
  $('#pan-far').innerHTML = mk(7, true); $('#pan-near').innerHTML = mk(31, false);
  let d = ''; for (let i = 0; i < 10; i++) d += `<i style="left:${ri(0, 100)}%;top:${ri(40, 100)}%;--dx:${ri(-60, 60)}px;animation-duration:${ri(9, 20)}s;animation-delay:-${ri(0, 18)}s"></i>`;
  $('#dust').innerHTML = d;
}
function sceneTo(t) {
  const i = Math.max(0, Object.keys(TABS).indexOf(t));
  $('#scene').dataset.s = { home: 'home', play: 'squad', col: 'col', packs: 'packs', prof: 'home' }[t]; $('#pan-near').style.transform = `translate3d(${-i * 18.75}%,0,0)`; $('#pan-far').style.transform = `translate3d(${-i * 12.5}%,0,0)`;

/* ---------- Частицы и вспышка ---------- */
let FX = [], fxOn = false;
function burst(col, n, el) {
  const cv = $('#fx'); if (!cv || !el || !n || noMotion()) return;
  const b = el.getBoundingClientRect(); cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < n; i++) { const a = R() * 6.283, s = rnd(2, 12); FX.push({ x: b.left + b.width / 2, y: b.top + b.height / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, l: rnd(.6, 1.4), t: 0, c: R() < .25 ? '#ffffff' : col, z: rnd(2, 5) }); }
  if (!fxOn) { fxOn = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  const cv = $('#fx'); if (!cv) { FX = []; fxOn = false; return; }
  const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
  FX = FX.filter(p => p.t < p.l);
  for (const p of FX) { p.t += 1 / 60; p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .985; c.globalAlpha = 1 - p.t / p.l; c.fillStyle = p.c; c.fillRect(p.x, p.y, p.z, p.z * 1.6); }
  c.globalAlpha = 1; if (FX.length) requestAnimationFrame(fxLoop); else fxOn = false;
}
function flashNow() { if (noMotion()) return; const f = document.createElement('div'); f.className = 'flash'; $('#over').appendChild(f); setTimeout(() => f.remove(), 600); }
const later = (ms, fn) => { const me = OV; setTimeout(() => { if (OV === me) fn(); }, noMotion() ? Math.min(ms, 150) : ms); };

function addImage(file, base) {
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const W = 300, H = 360, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const s = Math.max(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
    cv.getContext('2d').drawImage(im, (W - w) / 2, (H - h) * .15, w, h);
    IMG[base] = cv.toDataURL('image/jpeg', .82);
    try { localStorage.setItem(IKEY, JSON.stringify(IMG)); imgMsg = ''; } catch (e) { imgMsg = 'Фото показано, но не сохранится: хранилище браузера заполнено или недоступно.'; }
    render();
  }; im.onerror = () => { imgMsg = 'Не удалось прочитать файл. Подойдёт JPG или PNG.'; render(); }; im.src = rd.result; };
  rd.readAsDataURL(file);
}

  turar(v) { tuRar = +v; tuSel = []; }, tuClear() { tuSel = []; },
  tuAdd(v, d) { const id = +d.id; if (tuSel.length < 10 && tuSel.filter(x => x === id).length < own(id).n) tuSel.push(id); },
  tuDel(v, d) { const i = tuSel.lastIndexOf(+d.id); if (i >= 0) tuSel.splice(i, 1); },
  tuFill() { const l = Object.keys(G.cards).map(id => CARDS[id]).filter(c => !c.sp && c.rar === tuRar).sort((a, b) => a.ovr - b.ovr); for (const c of l) { let free = own(c.id).n - 1 - tuSel.filter(x => x === c.id).length; while (free-- > 0 && tuSel.length < 10) tuSel.push(c.id); } },
  tuGo() { const rar = tuRar, res = tuRun(G, tuSel); if (!res) return; tuSel = []; OV = { t: 'tu', res, rar, built: false }; },
  daily() { if (dailyReady(G, now())) { G.daily = mskDay(now()); G.packs.basic++; tab = 'packs'; } },
  open(v) { if (G.packs[v] > 0) { G.packs[v]--; startPack(v); } },
  buy(v) { const P = PACKS[v]; if (G.coins >= P.price) { G.coins -= P.price; startPack(v); } },
  poTap() { poTap(); return false; },
  poSkip() { if (OV && OV.t === 'pack' && OV.phase !== 'done') poDone(); return false; },
  ovClose() { OV = null; LV = null; window.scrollTo(0, 0); },
  fight() { const sq = squadOf(G), info = squadInfo(sq); if (!info) return; OV = { t: 'match', st: 'found', m: new Match(sq, G.tro, info.rating, { capt: captSlot(G) }), maps: shuffle([...MAPS]).slice(0, 3), ban: [], sel: [], plan: { dir: 'S', tempo: 'norm', focus: -1 }, reward: null, askQuit: false, built: false }; G.live = { sa: 0, sb: 0 }; },
  ban(v) { vetoBan(+v); return false; },
  sel(v) { if (!OV || OV.st !== 'live') return false; const m = OV.m, i = OV.sel.indexOf(v); if (i >= 0) OV.sel.splice(i, 1); else if (m.canPlay(m.a, OV.sel.concat(v))) OV.sel.push(v); else return false; sfx('tap'); handDraw(); return false; },
  dir(v) { if (OV && OV.st === 'live' && LV.ph === 'buy') { OV.plan.dir = v; planDraw(); } else if (OV && OV.st === 'live') OV.plan.dir = v; return false; },
  tempo(v) { if (OV && OV.st === 'live') { OV.plan.tempo = v; if (LV.ph === 'buy') planDraw(); } return false; },
  focus(v) { if (OV && OV.st === 'live') { OV.plan.focus = OV.plan.focus === +v ? -1 : +v; document.querySelectorAll('#rowA .chipp').forEach((c, i) => c.classList.toggle('foc', OV.plan.focus === i)); } return false; },
  pause() { if (LV) { LV.paused = !LV.paused; lvBtns(); } return false; },
  quitAsk() { OV.askQuit = true; lvBtns(); return false; }, quitNo() { OV.askQuit = false; lvBtns(); return false; },
  quitYes() { applyResult(G, false, OV.m.a.score, OV.m.b.score); delete G.live; OV = null; LV = null; },
  newAsk() { askNew = true; }, newNo() { askNew = false; },
  newYes() { askNew = false; try { backup('-before-reset', localStorage.getItem(KEY) || ''); } catch (e) { /* копия не сохранилась */ } G = newProfile(now()); tab = 'home'; tuSel = []; }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (e.target.id === 'sheet') { sheet = null; askSell = null; render(); } return; }
  if (b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (fn(b.dataset.v, b.dataset) === false) return;
  save(); render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'col-q') { F.q = e.target.value; colN = 45; const g = $('#col-grid'); if (g) g.innerHTML = colGrid(); }
  if (e.target.id === 'cmp-q' && sheet && sheet.t === 'cmpPick') { sheet.q = e.target.value; const tmp = document.createElement('div'); tmp.innerHTML = vSheet(); const nl = tmp.querySelector('#cmp-list'), l = $('#cmp-list'); if (nl && l) l.innerHTML = nl.innerHTML; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'img-in' && e.target.files && e.target.files[0]) addImage(e.target.files[0], +e.target.dataset.base);
  if (e.target.dataset && e.target.dataset.f) { F[e.target.dataset.f] = e.target.value; colN = 45; const g = $('#col-grid'); if (g) g.innerHTML = colGrid(); }
});
/* Осмотр карточки: наклон и блик за пальцем */
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('.tilt'); if (!t || noMotion()) return;
  const b = t.getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
  t.style.setProperty('--ry', ((x - .5) * 28).toFixed(1) + 'deg'); t.style.setProperty('--rx', ((.5 - y) * 22).toFixed(1) + 'deg');
  t.style.setProperty('--gx', (x * 100).toFixed(0) + '%'); t.style.setProperty('--gy', (y * 100).toFixed(0) + '%');
});
document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('.tilt'); if (t && !t.contains(e.relatedTarget)) { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); } });
function start() {
  const r = load();
  if (r !== 'ok') { G = newProfile(now()); if (r === 'broken') G.note = 'Сохранение не удалось прочитать. Его копия оставлена в памяти браузера, начата новая игра.'; }
  if (G.live) { applyResult(G, false, G.live.sa || 0, G.live.sb || 0); delete G.live; G.note = 'Прошлый матч был прерван и засчитан как поражение.'; }
  save(); buildScene(); render();
}
try { start(); document.getElementById('app').dataset.ok = 1; } catch (e) { window.__cmErr(e && e.stack || e); }
})();
</script>
