<title>Пятёрка Легенд</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"}}</script>

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0e11">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Вид: тактический шутер. Вертикальный экран телефона; за интерфейсом — сцена карты (небо, два слоя построек, дым, пыль),
   камера сдвигается при смене раздела; панели — тёмное стекло со срезанным углом; кейсы, лента редкостей и матч идут полноэкранными слоями */
@property --s1{syntax:'<color>';inherits:true;initial-value:#14181d}
@property --s2{syntax:'<color>';inherits:true;initial-value:#6b4a2a}
@property --s3{syntax:'<color>';inherits:true;initial-value:#0a0b0d}
:root{
  --bg:#0c0e11;--panel:rgb(18 21 26 / .66);--panel2:rgb(255 255 255 / .06);--line:rgb(255 255 255 / .11);--fg:#eef0f3;--mut:#9aa3ae;
  --accent:#f0a93a;--go:#7bc043;--go2:#4f9a23;--on-go:#0c1a04;--bad:#ff6b5e;--good:#7bd65a;--coin:#f2c14e;--sel:#ffd27a;
  --ct:#7fb2ff;--tt:#f0c269;
  --r0:#b0c3d9;--r1:#6c8cff;--r2:#a274ff;--r3:#e45cf2;--r4:#ff5a5a;--sp:#ff8a3d;--gold:#f2c14e;
  --f-d:'Oswald','Roboto Condensed','Arial Narrow',Impact,system-ui,sans-serif;
  --f-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-b);-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:13px}
h2{font:600 22px/1.1 var(--f-d);letter-spacing:.03em;text-transform:uppercase}
h3,.eyebrow{font:600 12px/1.2 var(--f-d);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.plain{display:flex;flex-direction:column;gap:10px;min-width:0}
.rowb{display:flex;gap:8px;flex-wrap:wrap}.rowb>*{flex:1 1 140px}

/* ---------- Сцена ---------- */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--s1:#14181d;--s2:#7a4f26;--s3:#0a0b0d;transition:--s1 .9s,--s2 .9s,--s3 .9s;background:linear-gradient(180deg,var(--s1) 0%,color-mix(in srgb,var(--s1) 55%,var(--s2)) 46%,var(--s2) 62%,var(--s3) 78%)}
#scene[data-s="packs"]{--s1:#0b1114;--s2:#8a5a16;--s3:#060708}
#scene[data-s="col"]{--s1:#0e1622;--s2:#2f5d86;--s3:#07090d}
#scene[data-s="squad"]{--s1:#0e1512;--s2:#4f6a35;--s3:#070907}
#scene .sun{position:absolute;left:50%;top:58%;width:130vmax;height:60vmax;transform:translate(-50%,-50%);background:radial-gradient(closest-side,color-mix(in srgb,var(--s2) 85%,#fff 15%),transparent 70%);opacity:.55}
#scene .pan{position:absolute;left:0;bottom:22%;width:400%;height:38vh;min-height:240px;transition:transform .9s cubic-bezier(.6,0,.2,1);will-change:transform}
#scene .pan.far{bottom:26%;opacity:.55;transition-duration:1.15s}
#scene .pan svg{width:100%;height:100%;display:block}
#scene .beam{position:absolute;top:-10%;width:34vmax;height:120%;background:linear-gradient(180deg,rgb(255 255 255 / .1),transparent 70%);transform-origin:50% 0;filter:blur(14px);mix-blend-mode:screen}
#scene .beam.b1{left:8%;transform:rotate(14deg);animation:sway 11s ease-in-out infinite alternate}
#scene .beam.b2{right:4%;transform:rotate(-18deg);animation:sway 14s ease-in-out infinite alternate-reverse;opacity:.7}
#scene .fog{position:absolute;left:-30%;right:-30%;bottom:8%;height:44%;background:radial-gradient(40% 55% at 22% 60%,rgb(255 255 255 / .1),transparent 70%),radial-gradient(45% 60% at 68% 50%,rgb(255 255 255 / .08),transparent 70%),radial-gradient(30% 50% at 48% 80%,rgb(255 255 255 / .07),transparent 70%);filter:blur(10px);animation:drift 26s linear infinite alternate}
#scene .floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,var(--s3),#050607)}
#scene .dust{position:absolute;inset:0}
#scene .dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgb(255 240 210 / .5);animation:mote linear infinite}
#scene .vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,transparent 40%,rgb(0 0 0 / .72)),linear-gradient(180deg,rgb(0 0 0 / .35),transparent 22%)}
@keyframes sway{to{transform:rotate(-6deg)}}
@keyframes drift{to{transform:translateX(12%)}}
@keyframes mote{from{transform:translate3d(0,0,0);opacity:0}15%{opacity:1}to{transform:translate3d(var(--dx),-70vh,0);opacity:0}}

/* ---------- Каркас ---------- */
#hud{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgb(8 9 11 / .92),rgb(8 9 11 / .55) 70%,transparent);padding-top:env(safe-area-inset-top,0px)}
#hud .wrap{display:flex;align-items:center;gap:10px;padding-block:10px 14px}
#hud .who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#hud .who b{display:block;font:600 16px/1.1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{flex:none;width:44px;height:30px}
.xp{display:block;height:3px;background:rgb(255 255 255 / .14);margin-top:5px;width:120px;max-width:100%}.xp i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 14px/1 var(--f-m);padding:8px 10px;background:rgb(0 0 0 / .45);border:1px solid var(--line)}
.coin{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,var(--coin) 55%,#8a6410);flex:none}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:rgb(0 0 0 / .45);flex:none}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{position:relative;z-index:1;padding-block:4px 104px;display:flex;flex-direction:column;gap:14px;min-height:70vh}
#app.enter>*{animation:pin .46s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes pin{from{opacity:0;transform:translate3d(calc(var(--dir,1)*36px),0,0)}to{opacity:1;transform:none}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgb(9 10 12 / .86);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:0}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 9px;font:600 10px/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);transition:color .2s}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs button::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#tabs button[aria-current]{color:var(--fg)}#tabs button[aria-current]::before{transform:scaleX(1)}
#tabs .dot{position:absolute;top:7px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--accent)}

.pn{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);clip-path:var(--cut);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.pn::before{content:"";position:absolute;left:0;top:0;width:3px;height:26px;background:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;font:600 15px/1.1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;background:rgb(255 255 255 / .09);border:1px solid var(--line);text-align:center;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(180deg,var(--go),var(--go2));color:var(--on-go);border-color:transparent;font-weight:700}
.btn.go{min-height:62px;font-size:24px;letter-spacing:.18em;clip-path:var(--cut);box-shadow:0 0 0 1px rgb(255 255 255 / .2) inset}
.btn.s{min-height:38px;font-size:13px}
.btn.dan{background:rgb(255 90 80 / .16);border-color:rgb(255 107 94 / .5);color:#ffb3ab}
.btn:disabled{opacity:.42;cursor:default}
.bar{display:block;height:5px;background:rgb(255 255 255 / .12);overflow:hidden}.bar i{display:block;height:100%;background:var(--rc,var(--accent))}
input[type=text]{width:100%;min-height:44px;padding:10px 12px;font:inherit;color:var(--fg);background:rgb(0 0 0 / .5);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:8px 12px;font:600 12px/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;background:rgb(0 0 0 / .45);border:1px solid var(--line);color:var(--mut);border-bottom:2px solid var(--rc,var(--line))}
.chip[aria-pressed=true]{color:var(--fg);background:rgb(255 255 255 / .14)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px;display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--line)}
.stat b{font:700 22px/1 var(--f-d)}.stat span{font:600 10px/1.2 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.warn{color:#ffb86b;font-size:12px}
.bdg{font:700 10px/1 var(--f-m);padding:3px 6px;text-transform:uppercase;letter-spacing:.06em}.bdg.new{background:var(--go);color:var(--on-go)}.bdg.dup{background:rgb(255 255 255 / .14);color:var(--mut)}

/* ---------- Карточка игрока ---------- */
.pc{--edge:var(--r0);--tc:#888;container-type:inline-size;position:relative;display:block;aspect-ratio:5/7;width:100%;min-width:0;overflow:hidden;isolation:isolate;clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%);background:radial-gradient(130% 62% at 50% 104%,color-mix(in srgb,var(--edge) 62%,transparent),transparent 72%),radial-gradient(80% 46% at 50% 30%,color-mix(in srgb,var(--tc) 34%,transparent),transparent 75%),linear-gradient(180deg,#2b3038,#171a20 55%,#0b0d10);color:#f4f6f8;text-align:left}
.pc.r1{--edge:var(--r1)}.pc.r2{--edge:var(--r2)}.pc.r3{--edge:var(--r3)}.pc.r4{--edge:var(--r4)}.pc.sp1{--edge:var(--sp)}.pc.sp2{--edge:var(--gold)}
.pc::before{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(118deg,rgb(255 255 255 / .045) 0 1.5px,transparent 1.5px 9px);pointer-events:none}
.pc::after{content:"";position:absolute;inset:0;z-index:5;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .13),inset 0 -3px 0 var(--edge);pointer-events:none}
.pc.sp1::before,.pc.sp2::before{background:repeating-linear-gradient(118deg,color-mix(in srgb,var(--edge) 26%,transparent) 0 3px,transparent 3px 11px)}
.pc .sh{position:absolute;inset:-20% -60%;z-index:3;background:linear-gradient(105deg,transparent 42%,rgb(255 255 255 / .3) 50%,transparent 58%);transform:translateX(-60%);pointer-events:none;opacity:0}
.pc.r3 .sh,.pc.r4 .sh,.pc.sp1 .sh,.pc.sp2 .sh{opacity:1;animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.pc .mg{position:absolute;z-index:0;right:-2cqw;top:14cqw;font:700 50cqw/1 var(--f-d);color:rgb(255 255 255 / .06);text-transform:uppercase;pointer-events:none}
.pc .art{position:absolute;z-index:1;left:12%;width:88%;top:15%;height:56%;opacity:.9}
.pc .ph{position:absolute;z-index:1;left:0;top:0;width:100%;height:78%;object-fit:cover;object-position:50% 10%;-webkit-mask-image:linear-gradient(#000 64%,transparent);mask-image:linear-gradient(#000 64%,transparent)}
.pc .hd{position:absolute;z-index:4;left:6cqw;top:5cqw;display:flex;flex-direction:column;align-items:flex-start;gap:1.5cqw}
.pc .ov{font:700 24cqw/1 var(--f-d);text-shadow:0 2px 8px rgb(0 0 0 / .7)}
.pc .rl{font:700 7.4cqw/1 var(--f-m);letter-spacing:.05em;padding:1.6cqw 2.4cqw;background:rgb(5 7 10 / .7);color:var(--edge)}
.pc .rk{position:absolute;z-index:4;right:15cqw;top:4.5cqw;font:700 6.4cqw/1 var(--f-m);color:rgb(255 255 255 / .6)}
.pc .ft{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:16cqw 6cqw 6.5cqw;display:flex;flex-direction:column;gap:.8cqw;background:linear-gradient(transparent,rgb(6 7 9 / .9) 46%)}
.pc .tag{font:700 6cqw/1.2 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--edge)}
.pc .nk{font:600 12.5cqw/1.1 var(--f-d);letter-spacing:.02em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .tm{font-size:7.2cqw;line-height:1.2;color:rgb(255 255 255 / .68);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:2cqw}
.pc .tm::before{content:"";flex:none;width:2.4cqw;height:2.4cqw;background:var(--tc);transform:rotate(45deg)}
.pc .tm .team-logo{width:7cqw;height:7cqw;object-fit:contain;flex:none;filter:drop-shadow(0 1px 2px #000)}.pc .tm .team-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc .tm .country{margin-left:auto;display:flex;align-items:center;gap:1cqw;font-size:5.8cqw;line-height:1;white-space:nowrap;color:rgb(255 255 255 / .8)}.pc .tm .country b{font-size:8cqw;font-weight:400;line-height:1}
.pc .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1cqw 2cqw;margin-top:2cqw;padding-top:2.4cqw;border-top:1px solid rgb(255 255 255 / .18);font:500 5.6cqw/1.2 var(--f-m);color:rgb(255 255 255 / .68)}
.pc .sg b{font-size:7.4cqw;color:#fff;margin-right:1.2cqw}
.pc .lv{display:flex;gap:1.4cqw;margin-top:1.8cqw}.pc .lv i{width:5cqw;height:1.6cqw;background:rgb(255 255 255 / .22)}.pc .lv i.on{background:var(--edge)}
.pc .cnt{position:absolute;z-index:6;right:5cqw;bottom:7cqw;font:700 7cqw/1 var(--f-m);padding:1.6cqw 2.6cqw;background:#f4f6f8;color:#0b0d10}
.pc.no{filter:grayscale(1) brightness(.75);opacity:.55}
.pc.xs .tm,.pc.xs .tag,.pc.xs .lv,.pc.xs .rk,.pc.xs .cnt{display:none}
.pc.xs .nk{font-size:15cqw}.pc.xs .ov{font-size:27cqw}.pc.xs .rl{font-size:10cqw}.pc.xs .ft{padding-bottom:9cqw}

/* ---------- Лобби ---------- */
.lobby{display:flex;flex-direction:column;gap:12px}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end;padding:26px 0 0;position:relative;perspective:700px}
.lineup::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:34px;background:radial-gradient(50% 100% at 50% 0,rgb(0 0 0 / .75),transparent 80%);z-index:-1}
.lineup>button{display:block;filter:drop-shadow(0 14px 14px rgb(0 0 0 / .6))}
.lineup>button:nth-child(1),.lineup>button:nth-child(5){transform:translateY(0) scale(.94)}
.lineup>button:nth-child(3){transform:translateY(-18px) scale(1.08);z-index:2}
.lineup>button:nth-child(2),.lineup>button:nth-child(4){transform:translateY(-9px)}
#app.enter .lineup>button{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}#app.enter .lineup>button:nth-child(2){animation-delay:.06s}#app.enter .lineup>button:nth-child(3){animation-delay:.12s}#app.enter .lineup>button:nth-child(4){animation-delay:.18s}#app.enter .lineup>button:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font:600 12px/1.2 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.kv b{font:700 17px/1 var(--f-d);color:var(--fg);letter-spacing:.02em}
.shop{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center}

/* ---------- Кейс ---------- */
.pk{--kc:#8fa3b8;position:relative;aspect-ratio:10/8;width:100%;filter:drop-shadow(0 12px 12px rgb(0 0 0 / .6))}
.pk.pro{--kc:var(--r2)}.pk.elite{--kc:var(--gold)}
.pk .lid,.pk .box{position:absolute;left:0;right:0;background:linear-gradient(180deg,#4a515c,#262a31);box-shadow:inset 0 0 0 1px rgb(255 255 255 / .18)}
.pk .lid{top:6%;height:34%;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.pk .box{top:40%;bottom:0;background:linear-gradient(180deg,#2e333b,#15181c);display:grid;place-items:center}
.pk .box::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--kc)}
.pk .box::after{content:"";position:absolute;left:8%;right:8%;bottom:14%;height:3px;background:repeating-linear-gradient(90deg,var(--kc) 0 8px,transparent 8px 14px);opacity:.7}
.pk .lock{position:absolute;left:50%;top:40%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);background:var(--kc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);z-index:2;transition:transform .4s,opacity .4s}
.pk b{font:700 11px/1 var(--f-d);letter-spacing:.2em;text-transform:uppercase;color:rgb(255 255 255 / .8)}
.pk.open .lid{transform:perspective(300px) rotateX(-62deg)}.pk.open .lock{transform:translate(-50%,160%) rotate(90deg);opacity:0}
.pk.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
.odds{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.odds span{font:700 11px/1 var(--f-m);text-align:center;padding:7px 2px;background:rgb(0 0 0 / .4);border-bottom:2px solid var(--rc)}

/* ---------- Нижний лист ---------- */
#sheet{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden],#over[hidden]{display:none}
#sheet .in{width:100%;max-height:94vh;overflow-y:auto;background:linear-gradient(180deg,#1a1d22,#0e1013);border-top:2px solid var(--accent);padding:16px 0 calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.col{display:flex;flex-direction:column;gap:12px}
.insp{display:grid;place-items:center;padding:6px 0;perspective:800px}
.tilt{width:62%;max-width:250px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .12s;position:relative;filter:drop-shadow(0 20px 22px rgb(0 0 0 / .7));touch-action:none}
.tilt::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(60% 50% at var(--gx,50%) var(--gy,20%),rgb(255 255 255 / .28),transparent 70%);mix-blend-mode:screen;clip-path:polygon(0 0,86% 0,100% 10%,100% 100%,0 100%)}
.attr{display:grid;grid-template-columns:86px 1fr 30px;gap:10px;align-items:center;font-size:13px}.attr b{font:700 13px var(--f-m);text-align:right}
.list{display:flex;flex-direction:column;gap:6px}

.scan-fr::before{left:6px;bottom:6px;border-right:0;border-top:0}.scan-fr::after{right:6px;bottom:6px;border-left:0;border-top:0}

/* ---------- Открытие кейса: простое появление и церемония 87+ ---------- */
.po-stage.wo-on{min-height:min(72vh,620px)}
.top1{width:58%;max-width:240px;animation:mat .5s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--gl) 55%,transparent)) drop-shadow(0 18px 24px rgb(0 0 0 / .7))}
.wo{--fc:#7d8794;position:relative;width:100%;min-height:min(72vh,620px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;isolation:isolate;background:#030405}
.wo-rays{position:absolute;inset:-30%;z-index:-2;background:repeating-conic-gradient(from 0deg at 50% 46%,color-mix(in srgb,var(--fc) 22%,transparent) 0 4deg,transparent 4deg 13deg);-webkit-mask-image:radial-gradient(closest-side at 50% 46%,#000 30%,transparent 80%);mask-image:radial-gradient(closest-side at 50% 46%,#000 30%,transparent 80%);transition:background .6s;animation:rays 18s linear infinite}
.wo-floor{position:absolute;left:-60%;right:-60%;bottom:-6%;height:48%;z-index:-1;transform:perspective(420px) rotateX(64deg);transform-origin:50% 100%;
  background:repeating-linear-gradient(60deg,transparent 0 38px,color-mix(in srgb,var(--fc) 70%,transparent) 38px 40px),repeating-linear-gradient(-60deg,transparent 0 38px,color-mix(in srgb,var(--fc) 70%,transparent) 38px 40px),repeating-linear-gradient(0deg,transparent 0 33px,color-mix(in srgb,var(--fc) 55%,transparent) 33px 35px),linear-gradient(180deg,transparent,color-mix(in srgb,var(--fc) 28%,#000));
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 35%);mask-image:linear-gradient(180deg,transparent,#000 35%);transition:background .6s}
.wo.pulse .wo-floor{animation:floorpulse .9s ease-out}
.wo-plate{position:absolute;top:7%;left:50%;transform:translate(-50%,-14px);opacity:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 22px;min-width:60%;text-align:center;background:linear-gradient(90deg,transparent,rgb(0 0 0 / .8) 15%,rgb(0 0 0 / .8) 85%,transparent);border-block:2px solid var(--fc);transition:opacity .3s,transform .35s}
.wo-plate.in{opacity:1;transform:translate(-50%,0)}
.wo-plate b{display:flex;align-items:center;gap:10px;font:700 26px/1.1 var(--f-d);letter-spacing:.08em;text-transform:uppercase}
.wo-k{font:700 10px/1 var(--f-m);letter-spacing:.24em;text-transform:uppercase;color:var(--fc)}
.wo-flag{font-size:76px;line-height:1;filter:drop-shadow(0 6px 14px rgb(0 0 0 / .7))}
.wo-plate:has(.wo-flag){background:none;border:0;padding:0;min-width:0}
.wo-cc{font-size:13cqw!important;background:none!important;padding:0!important}

.wo-crack svg{position:absolute;inset:-30% -40%;width:180%;height:160%;fill:none;stroke:#fff;stroke-width:.5;stroke-dasharray:80;stroke-dashoffset:80;filter:drop-shadow(0 0 3px var(--rc));animation:crack .8s .1s ease-out forwards}
.wo-crack.gone{opacity:0;transform:scale(1.3);filter:blur(6px) brightness(2.5)}
.wo-card{position:relative;width:56%;max-width:230px;-webkit-box-reflect:below 6px linear-gradient(transparent 62%,rgb(255 255 255 / .22));transition:filter .4s}
.wo-card:empty{visibility:hidden}
.wo-back{animation:mat .5s cubic-bezier(.2,1.3,.4,1) both;background:linear-gradient(160deg,color-mix(in srgb,var(--edge) 75%,#fff 10%),color-mix(in srgb,var(--edge) 40%,#000) 55%,color-mix(in srgb,var(--edge) 70%,#000));box-shadow:0 0 40px -6px var(--edge)}
.wo-back::before{background:repeating-linear-gradient(118deg,rgb(255 255 255 / .14) 0 2px,transparent 2px 12px)!important}
.wo-cc,.wo-tm{position:absolute;z-index:6;left:50%;transform:translateX(-50%);font:700 7.5cqw/1 var(--f-d);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:opacity .3s}
.wo-cc{bottom:30%;padding:2.4cqw 4cqw;background:rgb(0 0 0 / .55)}.wo-tm{bottom:14%;padding:2.4cqw 4cqw;color:#08090b}
.wo-cc:empty,.wo-tm:empty{opacity:0}
.wo-card.rim{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 14px var(--rc)) drop-shadow(0 0 34px var(--rc))}
.wo-face{animation:mat .6s cubic-bezier(.2,1.3,.4,1) both}
.wo.done .wo-rays{background:repeating-conic-gradient(from 0deg at 50% 46%,color-mix(in srgb,var(--fc) 40%,transparent) 0 4deg,transparent 4deg 11deg)}
@keyframes crack{to{stroke-dashoffset:0}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes floorpulse{0%{filter:brightness(2.2)}100%{filter:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Новая кинематографичная сцена выхода: только CSS и векторный силуэт, без тяжёлых видео и 3D-моделей */
.po-pk .pk{transition:transform .55s cubic-bezier(.2,.8,.2,1),filter .55s}
.po-pk .pk.open{transform:translateY(18px) scale(.82);filter:brightness(1.8) saturate(1.3);animation:none}
.po-stage{perspective:1000px}
.walk-scene{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:540px;min-height:330px;isolation:isolate}
.walk-card{position:absolute;right:7%;top:7%;width:43%;max-width:215px;z-index:1;transform:perspective(900px) rotateY(-13deg) scale(.94);filter:drop-shadow(0 18px 26px #000b);animation:card-arrive 1s cubic-bezier(.16,1,.3,1) both}
.operator{position:relative;z-index:2;width:64%;max-width:300px;align-self:flex-end;filter:drop-shadow(0 22px 22px #000c);animation:operator-arrive 1.45s cubic-bezier(.16,1,.3,1) both}
.operator svg{display:block;width:100%;height:auto;overflow:visible}
.actor-body{transform-origin:50% 90%;animation:operator-idle 2.8s ease-in-out infinite}
.op-rifle .actor-body{animation:rifle-check 2.8s ease-in-out infinite}
.op-awp .prop{transform-origin:55% 50%;animation:awp-recoil 2.5s 1.2s ease-out 1}.op-awp .muzzle-flash{opacity:0;transform-origin:220px 163px;animation:muzzle-flash .18s 1.2s ease-out 1}
.op-igl .prop{transform-origin:70% 55%;animation:notebook-check 2.8s ease-in-out infinite}
.walk-caption{position:absolute;z-index:3;left:2%;right:2%;bottom:1%;text-align:center;font:600 10px var(--f-m);letter-spacing:.2em;color:var(--gl,#f2c14e);text-shadow:0 2px 10px #000;opacity:.85}
@keyframes card-arrive{from{opacity:0;transform:perspective(900px) translateX(70px) rotateY(-28deg) scale(.72);filter:blur(8px)}to{opacity:1;transform:perspective(900px) rotateY(-13deg) scale(.94);filter:drop-shadow(0 18px 26px #000b)}}
@keyframes operator-arrive{0%{opacity:0;transform:translate(-90px,35px) scale(.72);filter:brightness(0) blur(7px)}65%{opacity:1;filter:brightness(.65)}100%{transform:translate(0,0) scale(1);filter:drop-shadow(0 22px 22px #000c)}}
@keyframes operator-idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rifle-check{0%,100%{transform:translateY(0) rotate(0)}22%{transform:translateY(-2px) rotate(-2deg)}48%{transform:translateY(0) rotate(2.5deg)}72%{transform:translateY(-1px) rotate(-1deg)}}
@keyframes awp-recoil{0%{transform:translateX(0)}12%{transform:translateX(-7px)}24%{transform:translateX(3px)}40%,100%{transform:translateX(0)}}
@keyframes muzzle-flash{0%{opacity:0;transform:scale(.2)}25%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1.8)}}
@keyframes notebook-check{0%,100%{transform:rotate(0)}35%{transform:rotate(-4deg)}65%{transform:rotate(2deg)}}
.all-reveal{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}

.all-reveal .walk-card{width:34%;max-width:145px}
.all-cards{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:start}

.all-card .pc{width:100%;font-size:clamp(6px,1.8vw,10px)}
.all-card>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:9px;color:var(--mut);margin-top:4px}
@keyframes all-card-in{from{opacity:0;transform:translateY(24px) scale(.82);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:none}}
#po-btn{gap:8px}
#po-btn .btn{min-height:44px}
@media(max-width:420px){.walk-scene{min-height:300px}.walk-card{right:2%;width:44%}.operator{width:68%}.all-reveal .walk-scene{min-height:190px;max-height:215px}.all-cards{gap:3px}.all-card .pc{font-size:6px}}
@media(prefers-reduced-motion:reduce){.operator,.operator .actor-body,.operator .prop,.walk-card,.all-card{animation:none!important;opacity:1!important;filter:none!important}}

:root{--bg:#080a0d;--panel:rgba(17,20,25,.78);--panel2:rgba(255,255,255,.045);--line:rgba(218,190,143,.17);--fg:#f1f0ed;--mut:#9299a2;--accent:#d7b477;--sel:#f0d6a3;--coin:#e4c17b;--go:#d7b477;--go2:#987343;--on-go:#17130c;--good:#9bc6a0;--bad:#e47e73;--gold:#e2bd79;--cut:none}

/* Profile: operator dossier and performance metrics */
#app[data-tab="prof"]>.pn:first-of-type{border-top:2px solid #a8b9ca;background:linear-gradient(120deg,rgba(30,43,57,.98),rgba(6,12,20,.99))}
#app[data-tab="prof"] .stats{gap:12px}
#app[data-tab="prof"] .stat{min-height:90px;justify-content:center;padding:15px;border-radius:2px;background:linear-gradient(145deg,#1c2d3d,#080f17)}
#app[data-tab="prof"] .stat b{font-size:30px;color:#eaf4fa}
.pn,.stat,.home-shortcut,.home-lineup{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#tabs{background:rgba(4,8,13,.97);border-top:1px solid rgba(154,192,218,.2);box-shadow:0 -14px 34px rgba(0,0,0,.28)}
#tabs .wrap{max-width:760px}
#tabs button{min-height:64px;gap:5px;font-size:10px;letter-spacing:.13em}
#tabs svg{width:27px;height:27px}
#tabs button[aria-current]{color:#f2f8fb}
#tabs button:before{background:#8cc9ec;height:2px;box-shadow:0 0 12px rgba(131,196,232,.65)}
#tabs .dot{background:#d7b982;box-shadow:0 0 10px rgba(215,185,130,.5)}
.btn.pri{background:linear-gradient(180deg,#d8e7f0,#83acc6);color:#07111a;border:1px solid rgba(234,246,252,.65);box-shadow:0 8px 20px rgba(99,161,198,.18)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.go{background:linear-gradient(100deg,#e4edf2,#91b8d2 52%,#dce8ef);color:#06111a}
@media(min-width:900px){
 #app[data-tab="home"]{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:start}
 #app[data-tab="home"]>.tutorial,#app[data-tab="home"]>.home-hero,#app[data-tab="home"]>.home-shortcuts{grid-column:1/-1}
 #app[data-tab="home"]>.home-lineup{grid-column:span 7}
 #app[data-tab="home"]>.home-league{grid-column:span 5}
 #app[data-tab="home"]>.home-streak{grid-column:span 7}
 #app[data-tab="home"]>.home-tasks{grid-column:span 5}
 #app[data-tab="home"]>.home-free{grid-column:span 5}
}
@media(max-width:760px){
 #app.wrap{padding:10px 14px 112px;gap:13px}
 .section-mast{grid-template-columns:54px minmax(0,1fr);gap:13px;min-height:108px;padding:16px 14px}
 .section-mast__icon{width:52px;height:52px}
 .section-mast__icon svg{width:37px;height:37px}
 .section-mast__serial{display:none}
 .section-mast h1{font-size:clamp(25px,7vw,34px)}
 .section-mast__desc{font-size:10px}
 .home-hero{min-height:250px;padding:18px 14px}
 .home-hero__copy{max-width:70%}
 .home-hero__artifact{right:-5%;width:47%;opacity:.9}
 .home-hero h1{font-size:clamp(34px,9vw,46px)}
 .home-hero__desc{font-size:11px;max-width:230px}
 .home-hero__tags{gap:4px}
 .home-hero__tags span{font-size:7px;padding:5px}
 .home-shortcuts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .home-shortcut,.home-shortcut:nth-child(n){min-height:88px;padding:12px 8px 12px 48px}
 .home-shortcut__icon{left:8px;width:32px;height:32px}
 .home-shortcut__icon svg{width:24px;height:24px}
 #app[data-tab="play"]{display:flex}
 #app[data-tab="play"]>.plain{padding:15px}
 #app[data-tab="col"] #col-grid .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 #app[data-tab="packs"] .shop{grid-template-columns:112px minmax(0,1fr);gap:12px}
 #app[data-tab="packs"] .pk{max-width:120px}
 #app[data-tab="prof"] .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
 #app[data-tab="prof"] .stat{min-height:74px;padding:9px}
 #app[data-tab="prof"] .stat b{font-size:24px}
}
@media(max-width:390px){
 #hud>.wrap{gap:6px}
 #hud .who{max-width:calc(100% - 70px)}
 #hud .who b{font-size:14px}
 #hud .pill{padding:7px 8px;font-size:12px}
 .tutorial{padding:16px 12px!important}
 .tutorial .steps div{font-size:12px}
 .home-hero{min-height:224px}
 .home-hero__copy{max-width:74%}
 .home-hero__artifact{right:-8%;width:46%}
 .home-hero__tags span{font-size:6px}
 #tabs button{font-size:9px}
}
@media(prefers-reduced-motion:reduce){
 #app.enter>*{animation:none!important}
 .home-hero__art .art-float{animation:none!important}
 .home-shortcut,.btn,.ibtn,.pc{transition:none!important}
}


/* ===== ARENA READABILITY + PLAYER PRESENTATION TIERS ===== */
#scene .arena-art{opacity:.13!important;filter:brightness(.48) saturate(.42) contrast(1.08)!important}
#scene .arena-world:after{background:linear-gradient(180deg,rgba(3,6,11,.32),rgba(3,6,11,.72) 42%,rgba(3,6,11,.94) 100%),linear-gradient(90deg,rgba(3,6,11,.46),transparent 24%,transparent 76%,rgba(3,6,11,.46)),radial-gradient(ellipse at 50% 35%,transparent 8%,rgba(0,0,0,.66) 100%)}
#scene .vig{background:rgba(3,6,11,.5)!important}
.section-mast{background:linear-gradient(112deg,#172838 0%,#0a1420 58%,#0a121c 100%)!important}
.pn{background:linear-gradient(145deg,#142131 0%,#0b1520 52%,#080f17 100%)!important;border-color:rgba(153,192,218,.22)}
.stat{background:linear-gradient(145deg,#1a2a3a,#0a121c)!important}
#app[data-tab="play"]>.plain{background:linear-gradient(145deg,#142333,#080f17)!important}
#app[data-tab="prof"]>.pn:first-of-type{background:linear-gradient(120deg,#1d2c3a,#0a121c)!important}
#app[data-tab="col"] #col-grid .grid>button{background:linear-gradient(145deg,#1a2a3a,#080f17)!important}
#app[data-tab="packs"] .pn{background:linear-gradient(145deg,#1b2935,#0a1119)!important}
/* 60–86: restrained graphite collectible; 87–90: silver-blue cinematic; 91–99: legendary gold */
.pc.standard{background:radial-gradient(90% 45% at 50% 100%,rgba(115,147,174,.2),transparent 75%),linear-gradient(155deg,#263543,#101923 52%,#070c12)}
.pc.standard:after{box-shadow:inset 0 0 0 1px rgba(202,220,233,.18),inset 0 -3px 0 var(--edge),inset 0 0 18px rgba(255,255,255,.025)}
.pc.cinema{border:1px solid rgba(177,220,246,.55);background:radial-gradient(90% 55% at 50% 32%,rgba(113,184,226,.22),transparent 70%),radial-gradient(90% 50% at 50% 100%,rgba(141,194,225,.32),transparent 75%),linear-gradient(150deg,#344b5e,#111e2b 52%,#050b12);box-shadow:0 0 0 1px rgba(159,211,242,.2),0 18px 32px rgba(0,0,0,.62),0 0 24px rgba(103,179,225,.16),inset 0 1px rgba(255,255,255,.3)}
.pc.cinema:after{inset:4px;border:1px solid rgba(196,226,244,.34);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -4px 0 var(--edge),inset 0 0 30px rgba(128,194,230,.12)}
.pc.cinema:before{background:repeating-linear-gradient(132deg,rgba(196,228,246,.08) 0 1px,transparent 1px 7px),linear-gradient(115deg,transparent 24%,rgba(210,238,252,.16) 50%,transparent 76%)}
.pc.cinema .sh{display:block;opacity:.78;animation:shine 3.2s ease-in-out infinite}
.pc.cinema-legend{border:1px solid rgba(240,211,143,.8);background:radial-gradient(90% 55% at 50% 30%,rgba(230,193,112,.28),transparent 70%),radial-gradient(90% 50% at 50% 100%,rgba(206,160,83,.36),transparent 75%),linear-gradient(150deg,#51432b,#1c1a16 52%,#080b10);box-shadow:0 0 0 2px rgba(222,186,112,.24),0 0 32px rgba(227,183,95,.22),0 22px 38px rgba(0,0,0,.7),inset 0 1px rgba(255,245,218,.38)}
.pc.cinema-legend:after{inset:5px;border:1px solid rgba(245,221,166,.56);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -4px 0 #d5b16f,inset 0 0 34px rgba(227,188,112,.16)}
.pc.cinema-legend:before{background:repeating-linear-gradient(132deg,rgba(255,224,158,.13) 0 2px,transparent 2px 8px),linear-gradient(115deg,transparent 20%,rgba(255,239,197,.2) 50%,transparent 80%)}
.pc.cinema-legend .sh{display:block;opacity:.9;animation:shine 2.8s ease-in-out infinite}
.pc.cinema-legend .rl,.pc.cinema-legend .tag{color:#f1d89e}
@media(prefers-reduced-motion:reduce){.pc.cinema .sh,.pc.cinema-legend .sh{animation:none!important}}


/* Unowned cards keep their rarity material; only the portrait is desaturated. */
.pc.no{filter:none!important;opacity:1!important}
.pc.no .ph,.pc.no .art{filter:grayscale(1) brightness(.72);opacity:.78}


/* League panel: visible rank insignia instead of an empty stretched surface */
.home-hero__artifact{right:1%;width:53%;height:100%}
.home-hero__art{max-height:370px}
.home-league{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:16px;min-height:250px;padding:20px}
.home-league>.league-emblem{grid-column:1;grid-row:1/5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:190px;border-right:1px solid rgba(160,194,218,.18)}
.league-emblem .rank{width:86px;height:62px;filter:drop-shadow(0 10px 15px rgba(0,0,0,.5))}
.league-emblem span{font:700 9px var(--f-m);letter-spacing:.22em;color:#91a9ba}
.league-emblem b{font:700 22px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:#e4edf3}
.home-league>.kv,.home-league>.bar,.home-league>p{grid-column:2}
.home-league>.kv{align-self:end}
.home-league>.bar{margin-block:8px}
.home-league>p{align-self:start}
@media(max-width:760px){
 .home-hero__artifact{right:-4%;width:54%;height:100%}
 .home-hero__art{max-height:300px}
 .home-league{grid-template-columns:82px minmax(0,1fr);min-height:150px;padding:14px;gap:12px}
 .home-league>.league-emblem{min-height:128px;gap:6px}
 .league-emblem .rank{width:68px;height:50px}
 .league-emblem b{font-size:17px}
 .league-emblem span{font-size:8px}
}

/* ===== LOBBY REDESIGN · ARENA HUB + COLLECTION FIRST ===== */
.home-progress{display:grid;grid-template-columns:1.35fr 1fr;gap:10px}
.home-progress__collection,.home-progress__level{position:relative;min-width:0;padding:15px 16px 14px;overflow:hidden;border:1px solid rgba(158,190,218,.24);border-radius:13px;background:linear-gradient(145deg,rgba(24,43,59,.97),rgba(8,15,23,.98));box-shadow:0 12px 26px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.08)}
.home-progress__collection:before,.home-progress__level:before{content:"";position:absolute;right:-30px;top:-48px;width:130px;height:130px;border:1px solid rgba(145,190,220,.16);border-radius:50%;box-shadow:0 0 0 14px rgba(145,190,220,.025),0 0 0 30px rgba(145,190,220,.02)}
.home-progress__top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 10px/1.2 var(--f-m);letter-spacing:.13em;color:#a9c3d8}
.home-progress__top b{font:700 23px/1 var(--f-d);color:#f3d18d;text-shadow:0 0 18px rgba(243,209,141,.18)}
.home-progress__value{position:relative;display:flex;align-items:baseline;gap:7px;margin:9px 0 8px}
.home-progress__value strong{font:700 25px/1 var(--f-d);color:#f2f5f8}
.home-progress__value span{font-size:10px;color:#aab7c3}
.home-progress__track{position:relative;height:7px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.home-progress__track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4e9fc8,#9bd5f2 72%,#f0d08e);box-shadow:0 0 12px rgba(110,183,225,.4)}
.home-progress__level .home-progress__track i{background:linear-gradient(90deg,#b77a35,#f3d18d)}
.home-progress__collection small,.home-progress__level small{position:relative;display:block;margin-top:8px;font-size:9px;line-height:1.35;color:#8fa0af}
.home-shortcuts{gap:10px}
.home-shortcut{min-height:96px;padding:13px 14px;border-radius:12px;border-color:rgba(150,185,213,.23);background:linear-gradient(145deg,rgba(27,43,57,.98),rgba(8,14,21,.98));box-shadow:inset 0 1px rgba(255,255,255,.08),0 12px 25px rgba(0,0,0,.28)}
.home-shortcut:first-child{border-color:rgba(240,190,103,.56);background:linear-gradient(145deg,rgba(91,67,34,.96),rgba(22,23,25,.98) 75%);box-shadow:inset 0 1px rgba(255,238,190,.16),0 12px 28px rgba(0,0,0,.34),0 0 24px rgba(220,164,79,.08)}
.home-shortcut:first-child .home-shortcut__icon{color:#ffe0a2;border-color:rgba(255,218,150,.48);background:linear-gradient(145deg,rgba(246,190,92,.34),rgba(80,49,17,.5))}
.home-shortcut__icon{width:34px;height:34px;border-radius:8px}
.home-shortcut b{font-size:13px;letter-spacing:.09em}
.home-shortcut small{font-size:10px}
.home-lineup{position:relative;padding:17px 15px 15px;border:1px solid rgba(205,174,112,.34);border-radius:15px;background:radial-gradient(ellipse at 50% 0,rgba(111,144,171,.19),transparent 55%),linear-gradient(155deg,rgba(20,34,47,.98),rgba(7,12,18,.98));box-shadow:0 20px 42px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08)}
.home-lineup:before{content:"";position:absolute;left:12px;right:12px;top:0;height:2px;background:linear-gradient(90deg,transparent,#d7b36e 20%,#f5dca8 50%,#d7b36e 80%,transparent);opacity:.85}
.home-lineup .kv{color:#b4c7d7}
.home-lineup .kv b{color:#f1d39a}
.home-lineup .lineup{padding-top:24px}
.home-lineup .btn.go{min-height:66px;margin-top:9px;border:1px solid rgba(255,231,181,.65);border-radius:9px;clip-path:none;background:linear-gradient(180deg,#f4c66f,#c98a36);color:#21170b;text-shadow:0 1px rgba(255,255,255,.28);box-shadow:inset 0 1px rgba(255,255,255,.5),0 8px 20px rgba(197,130,45,.22);font-size:25px;letter-spacing:.16em}
.home-lineup .stats{margin-top:10px}
.home-lineup .stat{background:linear-gradient(145deg,rgba(34,49,62,.92),rgba(8,14,20,.96));border-color:rgba(170,198,220,.15)}
.home-lineup .stat b{color:#f2f5f8}
.home-league{border-color:rgba(208,177,116,.28);background:linear-gradient(145deg,rgba(35,34,29,.96),rgba(12,15,19,.98))}
.home-league .bar i{background:linear-gradient(90deg,#ad7739,#f4d18b)}
.pk{filter:drop-shadow(0 18px 18px rgba(0,0,0,.7))}
.pk .lid,.pk .box{border:1px solid rgba(218,230,239,.26);box-shadow:inset 0 1px rgba(255,255,255,.22),inset 0 -8px 16px rgba(0,0,0,.24),0 0 22px color-mix(in srgb,var(--kc) 12%,transparent)}
.pk .lid{background:linear-gradient(145deg,#778797 0%,#384a5b 35%,#172532 72%,#0a121a 100%)}
.pk .box{background:linear-gradient(145deg,#455b6d 0%,#202e3b 36%,#0d1721 100%)}
.pk.pro .lid,.pk.pro .box{background:linear-gradient(145deg,#8068a9,#302448 55%,#120e1d)}
.pk.elite .lid,.pk.elite .box{background:linear-gradient(145deg,#b58a3e,#54401e 48%,#19140b)}
.pk .pk-stamp{width:31%;border-width:2px;transform:translate(-50%,-50%) rotate(45deg);border-radius:4px}
.pk .pk-stamp:after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.22)}
.pk .box b{font-size:clamp(8px,1.7vw,11px);letter-spacing:.22em}
@media(max-width:600px){
 .home-progress{grid-template-columns:1fr 1fr;gap:8px}
 .home-progress__collection,.home-progress__level{padding:12px 11px}
 .home-progress__top{font-size:8px;letter-spacing:.08em}
 .home-progress__top b{font-size:20px}
 .home-progress__value{gap:5px;flex-wrap:wrap}
 .home-progress__value strong{font-size:22px}
 .home-progress__value span{font-size:9px}
 .home-progress__collection small,.home-progress__level small{font-size:8px}
 .home-shortcut{min-height:82px;padding:11px}
}
@media(min-width:700px){
 #app[data-tab="home"]>.home-progress{grid-column:1/-1}
}


/* ===== ARENA LOBBY V2: полный пересмотр композиции главного экрана ===== */
#app[data-tab="home"]{display:flex!important;flex-direction:column!important;gap:13px!important;max-width:760px!important;margin-inline:auto!important}
#app[data-tab="home"]>.home-stage{grid-column:1/-1}
.home-stage{position:relative;isolation:isolate;overflow:hidden;min-height:485px;padding:19px 16px 13px;border:1px solid rgba(177,207,229,.28);border-radius:23px;background:linear-gradient(180deg,#101b29 0%,#172638 35%,#0b111a 70%,#080b10 100%);box-shadow:0 24px 65px #0009,inset 0 1px #ffffff18}
.home-stage:before{content:"";position:absolute;inset:8px;z-index:4;border:1px solid rgba(183,211,232,.12);border-radius:17px;pointer-events:none}
.home-stage__sky{position:absolute;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#6485a533,transparent 42%),linear-gradient(180deg,#172a3c 0%,#111c29 48%,#0a1119 75%,#080b10 100%)}
.home-stage__light{position:absolute;top:-18%;width:34%;height:76%;filter:blur(24px);opacity:.6;background:linear-gradient(180deg,#b9e3ff55,transparent)}
.home-stage__light--one{left:5%;transform:rotate(17deg);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.home-stage__light--two{right:5%;transform:rotate(-17deg);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.home-stage__smoke{position:absolute;left:-15%;right:-15%;bottom:22%;height:32%;background:radial-gradient(ellipse at 20% 70%,#b9d7e522,transparent 45%),radial-gradient(ellipse at 70% 55%,#a6c4db20,transparent 48%);filter:blur(17px)}
.home-stage__stands{position:absolute;left:-8%;right:-8%;top:28%;height:34%;opacity:.65;background:repeating-linear-gradient(90deg,transparent 0 17px,#9cb7cb15 18px 20px),linear-gradient(180deg,#0a111b00,#05090fdd);clip-path:polygon(0 12%,15% 0,85% 0,100% 12%,100% 100%,0 100%)}
.home-stage__truss{position:absolute;top:12%;left:7%;right:7%;height:15%;border-top:2px solid #a8c8df55;border-bottom:1px solid #a8c8df33;background:repeating-linear-gradient(90deg,transparent 0 28px,#a8c8df26 29px 30px)}
.home-stage__floor{position:absolute;left:-20%;right:-20%;bottom:-15%;height:48%;transform:perspective(260px) rotateX(54deg);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,transparent 0 49px,#a6cce51c 50px 51px),repeating-linear-gradient(0deg,transparent 0 35px,#a6cce51a 36px 37px),linear-gradient(180deg,#1c3446aa,#05080d)}
.home-stage__top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.home-stage__eyebrow{font:700 9px var(--f-m);letter-spacing:.2em;color:#9dbbd1}
.home-stage h1{margin:7px 0 4px;font:700 clamp(31px,8vw,49px)/.94 var(--f-d);letter-spacing:.055em;color:#f2f6f8;text-shadow:0 4px 20px #000a}
.home-stage__top p{font-size:11px;color:#b2c1cd}
.home-stage__season{flex:none;min-width:83px;padding:9px 10px;border:1px solid #b8d0e044;background:#07111dbb;display:flex;flex-direction:column;gap:3px;text-align:right}
.home-stage__season span,.home-stage__season small{font:700 8px var(--f-m);letter-spacing:.13em;color:#8fa9bc}
.home-stage__season b{font:600 13px var(--f-d);text-transform:uppercase;color:#e8edf1}
.home-stage__matchline{position:relative;z-index:2;display:flex;justify-content:space-between;gap:8px;margin-top:20px;padding:8px 10px;border-block:1px solid #a7c5dc30;background:linear-gradient(90deg,#07111dcc,#0b1520aa,#07111dcc);font:700 8px var(--f-m);letter-spacing:.1em;color:#9db5c8}
.home-stage__matchline span{display:flex;align-items:center;gap:7px}.home-stage__matchline i{width:6px;height:6px;border-radius:50%;background:#75d69b;box-shadow:0 0 10px #75d69b}
.home-stage__matchline b{color:#d4e1eb}.home-stage__matchline em{color:#d6ad6c;font-style:normal}
.home-stage__teamhead{position:relative;z-index:2;display:flex;justify-content:space-between;margin:13px 2px 7px;font:700 9px var(--f-m);letter-spacing:.13em;color:#b8c9d6}
.home-stage__lineup{position:relative;z-index:2;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:end;padding:17px 0 8px}
.home-stage__lineup>button{min-width:0;filter:drop-shadow(0 12px 12px #000b)}
.home-stage__lineup>button:nth-child(1),.home-stage__lineup>button:nth-child(5){transform:translateY(10px) scale(.94)}
.home-stage__lineup>button:nth-child(2),.home-stage__lineup>button:nth-child(4){transform:translateY(2px)}
.home-stage__lineup>button:nth-child(3){transform:translateY(-10px) scale(1.055);z-index:2}
.home-stage__lineup .pc{border-radius:7px;box-shadow:0 0 0 1px #d7e7f244,0 12px 22px #0009}
.home-stage__lineup .pc .ft{padding-bottom:8cqw}
.home-stage__lineup .slot.empty{aspect-ratio:5/7;display:flex!important;flex-direction:column;justify-content:center;align-items:center;gap:8px;border:1px dashed #b4cde055;background:#0b1724aa;color:#b8cad7}
.home-stage__lineup .slot.empty .ph0{font-size:28px}.home-stage__lineup .slot.empty small{font-size:8px;text-transform:uppercase}
.home-stage__bottom{position:relative;z-index:2;display:grid;grid-template-columns:minmax(90px,.75fr) minmax(0,1.4fr);gap:12px;align-items:center;margin-top:8px;padding:12px 11px;background:linear-gradient(110deg,#07101bdc,#172b3bdc);border:1px solid #b3d1e344;border-radius:12px}
