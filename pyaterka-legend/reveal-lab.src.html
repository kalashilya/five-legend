<script>
'use strict';
/* Тестовые выпадения: в игре сюда придёт лучшая карточка кейса */
const DEMO = {
  elite: { box: 'elite', boxN: 'Элитный', nick: 'molodoy', team: 'FURIA', cc: 'KZ', role: 'AWP', ovr: 92, rar: 'Тайное', col: '#ff4d4d', tc: '#2f8f55', st: [['СТР', 94], ['ОПН', 92], ['КЛЧ', 95], ['ГРН', 92], ['ПОЗ', 99], ['ТАК', 87]] },
  pro: { box: 'pro', boxN: 'Про', nick: 'Krabeni', team: 'BETBOOM', cc: 'RU', role: 'LRK', ovr: 81, rar: 'Засекреченное', col: '#e45cf2', tc: '#d8b13a', st: [['СТР', 79], ['ОПН', 78], ['КЛЧ', 86], ['ГРН', 77], ['ПОЗ', 84], ['ТАК', 76]] },
  basic: { box: 'basic', boxN: 'Базовый', nick: 'svemyy', team: 'WBT Academy', cc: 'UA', role: 'SUP', ovr: 64, rar: 'Армейское', col: '#6c8cff', tc: '#3a5bd9', st: [['СТР', 61], ['ОПН', 63], ['КЛЧ', 67], ['ГРН', 74], ['ПОЗ', 65], ['ТАК', 65]] }
};
const WALK = 87;
const BOX = { basic: { body: 0x4a5130, rough: .72, metal: .08, trim: 0x2a2d22, accent: '#c9c19a' }, pro: { body: 0x2f3946, rough: .42, metal: .55, trim: 0x9aa6b2, accent: '#b9c6d3' }, elite: { body: 0x121315, rough: .35, metal: .6, trim: 0xc8a24a, accent: '#e2bd63' } };
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeO = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3), easeIO = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

const FLAG_IMG = {};
const loadFlag = cc => FLAG_IMG[cc] ? Promise.resolve(FLAG_IMG[cc]) : new Promise(res => { const svg = typeof FLAGS !== 'undefined' && FLAGS[cc]; if (!svg) return res(null);
  const im = new Image(); im.onload = () => { FLAG_IMG[cc] = im; res(im); }; im.onerror = () => res(null); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });

/* ---------- Рендер ---------- */
const cv = $('#gl'); let R3;
try { R3 = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' }); } catch (e) { $('#nogl').style.display = 'grid'; throw e; }
R3.setPixelRatio(Math.min(devicePixelRatio, 2)); R3.outputEncoding = THREE.sRGBEncoding; R3.toneMapping = THREE.ACESFilmicToneMapping; R3.toneMappingExposure = 1.1;
R3.shadowMap.enabled = true; R3.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030407); scene.fog = new THREE.FogExp2(0x030407, .035);
const cam = new THREE.PerspectiveCamera(38, 1, .1, 100);
function resize() { const w = innerWidth, h = innerHeight; R3.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < .7 ? 46 : 34; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- Текстуры на canvas ---------- */
const tex = (w, h, draw, srgb = true) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = R3.capabilities.getMaxAnisotropy(); return t; };
const dot = tex(64, 64, (g, w) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const tri = tex(512, 512, (g, w) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, w); g.strokeStyle = '#fff'; g.lineWidth = 3; const s = w / 4, hh = s * Math.sqrt(3) / 2;
  for (let y = -1; y < 6; y++) for (let x = -1; x < 6; x++) { const ox = x * s + (y % 2 ? s / 2 : 0), oy = y * hh; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + s, oy); g.lineTo(ox + s / 2, oy + hh); g.closePath(); g.stroke(); } }, false);
tri.wrapS = tri.wrapT = THREE.RepeatWrapping; tri.repeat.set(10, 10);
/* потёртости и шум для пластика и металла кейса */
const grime = tex(512, 512, (g, w) => { g.fillStyle = '#808080'; g.fillRect(0, 0, w, w); for (let i = 0; i < 2600; i++) { const v = 100 + Math.random() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v},${Math.random() * .5})`; g.fillRect(Math.random() * w, Math.random() * w, 1 + Math.random() * 3, 1 + Math.random() * 3); }
  g.strokeStyle = 'rgba(200,200,200,.35)'; for (let i = 0; i < 70; i++) { g.lineWidth = Math.random() * 1.5; g.beginPath(); const x = Math.random() * w, y = Math.random() * w; g.moveTo(x, y); g.lineTo(x + (Math.random() - .5) * 60, y + (Math.random() - .5) * 12); g.stroke(); } }, false);
grime.wrapS = grime.wrapT = THREE.RepeatWrapping;
/* пена внутри кейса: «яичная решётка» */
const foamT = tex(256, 256, (g, w) => { g.fillStyle = '#1a1b1e'; g.fillRect(0, 0, w, w); const n = 8, s = w / n; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const r = g.createRadialGradient(x * s + s / 2, y * s + s / 2, 1, x * s + s / 2, y * s + s / 2, s * .62); r.addColorStop(0, '#3a3c42'); r.addColorStop(1, '#141518'); g.fillStyle = r; g.fillRect(x * s, y * s, s, s); } });
foamT.wrapS = foamT.wrapT = THREE.RepeatWrapping;

/* ---------- Арена: пол, лучи, пыль ---------- */
const tint = new THREE.Color('#5d6670'), tintTo = new THREE.Color('#5d6670');

scene.add(new THREE.HemisphereLight(0x9aa8b8, 0x0a0a0a, .35));
/* окружение для отражений: тёмная студия с софтбоксами */
{ const es = new THREE.Scene(), pm = new THREE.PMREMGenerator(R3), box = (w, h, x, y, z, c) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  es.background = new THREE.Color(0x050608); box(6, 2, 0, 6, 2, 0xffffff); box(2, 5, -6, 1, 1, 0x8899aa); box(2, 5, 6, 1, 1, 0xaa9988); box(8, 1, 0, -1, -6, 0x333840);
  scene.environment = pm.fromScene(es, .03).texture; pm.dispose(); }
/* небо-градиент и дымка у горизонта */
const sky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { c: { value: new THREE.Color('#5d6670') } },
  vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 c;varying vec3 vP;void main(){float h=normalize(vP).y;float haze=exp(-abs(h-.03)*9.);vec3 col=mix(vec3(.004,.005,.009),vec3(.02,.025,.035),smoothstep(.6,0.,h))+c*haze*.22;gl_FragColor=vec4(col,1.);\n#include <encodings_fragment>\n}' }));
scene.add(sky);
/* огни вдали: размытые круги, как прожекторы арены не в фокусе */
const bokeh = [];
for (let i = 0; i < 26; i++) { const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: null, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .0 })); const a = (i / 26) * Math.PI * 1.2 - Math.PI * .6, r = 14 + Math.random() * 6;
  m.position.set(Math.sin(a) * r, 1.5 + Math.random() * 5, -Math.cos(a) * r - 4); const s = .6 + Math.random() * 1.6; m.scale.set(s, s, 1); m.userData = { ph: Math.random() * 6.28, base: .1 + Math.random() * .25 }; scene.add(m); bokeh.push(m); }
const key = new THREE.SpotLight(0xffffff, 3.4, 30, .5, .55, 1.2); key.position.set(1.5, 9, 5); key.target.position.set(0, .4, 0); key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -.0004; scene.add(key, key.target);
const rimL = new THREE.PointLight(0xffffff, 2.6, 12, 2), rimR = rimL.clone(); rimL.position.set(-3.4, 2.6, -1.8); rimR.position.set(3.4, 2.6, -1.8); scene.add(rimL, rimR);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x07080b, metalness: .7, roughness: .36, emissive: tint.clone(), emissiveMap: tri, emissiveIntensity: .45, transparent: true, opacity: .9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const beamMat = () => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, uniforms: { c: { value: tint.clone() }, a: { value: .18 } },
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 c;uniform float a;varying vec2 vUv;void main(){float f=pow(vUv.y,1.6)*(1.-abs(vUv.x-.5)*1.6);gl_FragColor=vec4(c*f*a*2.2,1.);}' });
const beams = [].map((x, i) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.08, 1.25, 11, 32, 1, true), beamMat()); m.geometry.translate(0, -5.5, 0); m.position.set(x, 10, -2.4 - (i % 2)); scene.add(m); return m; });
const DUST = 800, dg = new THREE.BufferGeometry(), dp = new Float32Array(DUST * 3), dv = new Float32Array(DUST);
for (let i = 0; i < DUST; i++) { dp[i * 3] = (Math.random() - .5) * 14; dp[i * 3 + 1] = Math.random() * 7; dp[i * 3 + 2] = (Math.random() - .5) * 10 - 1; dv[i] = .05 + Math.random() * .15; }
dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
scene.add(new THREE.Points(dg, new THREE.PointsMaterial({ map: dot, size: .055, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xfff0d8, opacity: .6 })));
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: tint.clone(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 })); glow.scale.set(3.6, 4.6, 1); scene.add(glow);
const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 96), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); scene.add(ring);

/* ---------- Оружейный кейс ----------
   Корпус и крышка — выдавленный прямоугольник со скруглёнными углами; рёбра жёсткости, уголки, ручка,
   две защёлки на петлях, пена внутри с гнездом под карточку, свет изнутри цвета редкости. */
const CASE = { w: 3.1, d: 1.9, hb: .56, hl: .34 };
const rrect = (w, h, r) => { const s = new THREE.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s; };
const shell = (h) => { const g = new THREE.ExtrudeGeometry(rrect(CASE.w, CASE.d, .16), { depth: h, bevelEnabled: true, bevelThickness: .035, bevelSize: .035, bevelSegments: 3, curveSegments: 10 }); g.rotateX(-Math.PI / 2); return g; };
const caseG = new THREE.Group(); scene.add(caseG);
const bodyMat = new THREE.MeshStandardMaterial({ roughnessMap: grime, bumpMap: grime, bumpScale: .004 }), trimMat = new THREE.MeshStandardMaterial({ metalness: .9, roughness: .3 }), rubber = new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: .9, metalness: 0 });
const stencilMat = new THREE.MeshStandardMaterial({ transparent: true, roughness: .8, metalness: 0, polygonOffset: true, polygonOffsetFactor: -2 });
const mesh = (g, m, p, parent = caseG) => { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; if (p) o.position.set(p[0], p[1], p[2]); parent.add(o); return o; };
const lower = mesh(shell(CASE.hb), bodyMat, [0, .04, 0]);
/* горизонтальные рёбра по бокам корпуса */
for (const y of [.2, .42]) { mesh(new THREE.BoxGeometry(CASE.w + .1, .05, .04), bodyMat, [0, y, CASE.d / 2 + .04]); mesh(new THREE.BoxGeometry(CASE.w + .1, .05, .04), bodyMat, [0, y, -CASE.d / 2 - .04]); }
/* пена и гнездо под карточку */
const foam = mesh(new THREE.PlaneGeometry(CASE.w - .14, CASE.d - .14), new THREE.MeshStandardMaterial({ map: foamT, roughness: 1, bumpMap: foamT, bumpScale: .02 }), [0, CASE.hb + .02, 0]); foam.rotation.x = -Math.PI / 2; foamT.repeat.set(6, 4);
const slotMat = new THREE.MeshBasicMaterial({ color: 0x000000 }), slot = mesh(new THREE.PlaneGeometry(1.0, 1.4), slotMat, [0, CASE.hb + .025, .05]); slot.rotation.x = -Math.PI / 2;
const innerLight = new THREE.PointLight(0xffffff, 0, 2.6, 2); innerLight.position.set(0, CASE.hb + .6, .3); caseG.add(innerLight);
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.55, .9, 5, 32, 1, true), beamMat()); shaft.geometry.translate(0, 2.5, 0); shaft.position.set(0, CASE.hb, .05); shaft.rotation.x = Math.PI; shaft.material.uniforms.a.value = 0; caseG.add(shaft); shaft.rotation.set(0, 0, 0);
shaft.material.fragmentShader = 'uniform vec3 c;uniform float a;varying vec2 vUv;void main(){float f=pow(1.-vUv.y,1.4)*(1.-abs(vUv.x-.5)*1.4);gl_FragColor=vec4(c*f*a*2.5,1.);}';
/* крышка на петле у задней стенки */
const lidPivot = new THREE.Group(); lidPivot.position.set(0, CASE.hb + .075, -CASE.d / 2 - .03); caseG.add(lidPivot);
const lidG = new THREE.Group(); lidG.position.set(0, 0, CASE.d / 2 + .03); lidPivot.add(lidG);
mesh(shell(CASE.hl), bodyMat, [0, 0, 0], lidG);
const lidFoam = mesh(new THREE.PlaneGeometry(CASE.w - .14, CASE.d - .14), new THREE.MeshStandardMaterial({ map: foamT, roughness: 1, color: 0x6a6a6a }), [0, -.005, 0], lidG); lidFoam.rotation.x = Math.PI / 2;
for (const z of [-.5, 0, .5]) mesh(new THREE.BoxGeometry(CASE.w - .5, .05, .1), bodyMat, [0, CASE.hl + .05, z], lidG);
const stencil = mesh(new THREE.PlaneGeometry(2.4, .9), stencilMat, [0, CASE.hl + .036, .02], lidG); stencil.rotation.x = -Math.PI / 2;
/* уголки, ручка, петли */
const corners = [];
for (const sx of [-1, 1]) for (const sz of [-1, 1]) { corners.push(mesh(new THREE.BoxGeometry(.3, CASE.hb + .02, .3), trimMat, [sx * (CASE.w / 2 - .06), CASE.hb / 2 + .05, sz * (CASE.d / 2 - .06)])); corners.push(mesh(new THREE.BoxGeometry(.3, CASE.hl + .02, .3), trimMat, [sx * (CASE.w / 2 - .06), CASE.hl / 2 + .02, sz * (CASE.d / 2 - .06) - CASE.d / 2 - .03 + CASE.d / 2 + .03], lidG)); }
const handle = new THREE.Group(); handle.position.set(0, .3, CASE.d / 2 + .08); caseG.add(handle);

const latches = [-.95, .95].map(x => { const base = mesh(new THREE.BoxGeometry(.38, .2, .06), trimMat, [x, CASE.hb - .07, CASE.d / 2 + .06]);
  const piv = new THREE.Group(); piv.position.set(x, CASE.hb - .14, CASE.d / 2 + .1); caseG.add(piv);
  const lever = mesh(new THREE.BoxGeometry(.32, .34, .05), trimMat, [0, .17, 0], piv); mesh(new THREE.BoxGeometry(.2, .06, .07), rubber, [0, .3, .02], piv);
  return { piv, open: 0, x }; });
const seam = mesh(new THREE.BoxGeometry(CASE.w - .2, .012, CASE.d - .2), new THREE.MeshBasicMaterial({ color: 0x000000 }), [0, CASE.hb + .075, 0]);
const CS = .72; caseG.scale.setScalar(CS); caseG.position.set(0, 0, .3); caseG.rotation.y = -.18;
function skinCase(kind, P) {

  const t = tex(1024, 384, (g, w, h) => { g.clearRect(0, 0, w, h); g.fillStyle = B.accent; g.globalAlpha = .9; g.font = '700 150px Oswald, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('ПЯТЁРКА ЛЕГЕНД', w / 2, h * .42);
    g.font = '700 56px JetBrains Mono, monospace'; g.fillText('КЕЙС · ' + P.boxN.toUpperCase(), w / 2, h * .82); g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 900; i++) { g.globalAlpha = Math.random() * .6; g.fillRect(Math.random() * w, Math.random() * h, Math.random() * 6, Math.random() * 3); } });

/* ---------- Карточка: пластина со скошенным углом, металлическое ребро, голографическая лицевая сторона ---------- */
