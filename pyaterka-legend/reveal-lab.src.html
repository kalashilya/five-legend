<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Открытие кейса 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@700&display=swap">
<style>
/* Эталон 3D-открытия кейса: сцена WebGL на весь экран, поверх — подписи и кнопки */
:root{--bg:#030407;--fg:#eef0f3;--mut:#8f98a3;--go:#7bc043;--f-d:'Oswald','Roboto Condensed','Arial Narrow',Impact,sans-serif;--f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--f-d)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:calc(14px + env(safe-area-inset-top,0px))}.bot{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:700 11px/1 var(--f-m);letter-spacing:.28em;text-transform:uppercase;color:var(--mut)}
.title{font:700 30px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;text-shadow:0 0 24px var(--gl,#fff)}
.title.on{opacity:1;transform:none}
.sub{font:700 12px/1.2 var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--gl,#fff);opacity:0;transition:opacity .5s}.sub.on{opacity:1}
.row{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
button{font:600 13px/1 var(--f-d);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:rgb(255 255 255 / .1);border:1px solid rgb(255 255 255 / .18);padding:12px 16px;min-height:44px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button.pri{background:linear-gradient(180deg,#7bc043,#4f9a23);color:#0c1a04;border-color:transparent;font-weight:700}
button:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#hint{font:700 12px/1 var(--f-m);letter-spacing:.2em;text-transform:uppercase;color:#cfd6de;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
</style></head><body>
<canvas id="gl"></canvas><div id="flash"></div>
<div class="ui top"><span class="eyebrow" id="eb">Кейс «Элитный»</span><span class="title" id="tt"></span><span class="sub" id="st"></span></div>
<div class="ui bot"><span id="hint">Нажмите на кейс</span><div class="row"><button data-k="walk" class="pri">Редкий игрок 87+</button><button data-k="simple">Обычная карточка</button><button id="skip">Пропустить</button></div></div>
<script>/*THREE*/</script>
<script>
'use strict';
/* Тестовые игроки: в игре сюда придут данные выпавшей карточки */
const DEMO = {
  walk: { nick: 'molodoy', team: 'FURIA', cc: 'KZ', role: 'AWP', ovr: 92, rar: 'Тайное', col: '#ff4d4d', tc: '#2f7d4a', st: [['СТР', 94], ['ОПН', 92], ['КЛЧ', 95], ['ГРН', 92], ['ПОЗ', 99], ['ТАК', 87]], walk: true },
  simple: { nick: 'svemyy', team: 'WBT Academy', cc: 'UA', role: 'SUP', ovr: 64, rar: 'Армейское', col: '#6c8cff', tc: '#3a5bd9', st: [['СТР', 61], ['ОПН', 63], ['КЛЧ', 67], ['ГРН', 74], ['ПОЗ', 65], ['ТАК', 65]], walk: false }
};
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3), easeIO = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const flagOf = cc => [...cc].map(ch => String.fromCodePoint(127397 + ch.charCodeAt(0))).join('');

/* ---------- Рендер ---------- */
const cv = $('#gl'), R3 = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
R3.setPixelRatio(Math.min(devicePixelRatio, 2)); R3.outputEncoding = THREE.sRGBEncoding; R3.toneMapping = THREE.ACESFilmicToneMapping; R3.toneMappingExposure = 1.15;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x030407); scene.fog = new THREE.FogExp2(0x030407, .055);
const cam = new THREE.PerspectiveCamera(38, 1, .1, 100), camBase = new THREE.Vector3(0, 1.35, 8.4), look = new THREE.Vector3(0, 1.25, 0);
function resize() { const w = innerWidth, h = innerHeight; R3.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < .7 ? 44 : 34; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- Текстуры, нарисованные на canvas ---------- */
const tex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = R3.capabilities.getMaxAnisotropy(); return t; };
const dot = tex(64, 64, (g, w) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.25, 'rgba(255,255,255,.6)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, w, w); });
const tri = tex(512, 512, (g, w) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, w); g.strokeStyle = '#fff'; g.lineWidth = 3; const s = w / 4, hh = s * Math.sqrt(3) / 2;
  for (let y = -1; y < 6; y++) for (let x = -1; x < 6; x++) { const ox = x * s + (y % 2 ? s / 2 : 0), oy = y * hh; g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + s, oy); g.lineTo(ox + s / 2, oy + hh); g.closePath(); g.stroke(); } });
tri.wrapS = tri.wrapT = THREE.RepeatWrapping; tri.repeat.set(10, 10); tri.encoding = THREE.LinearEncoding;

/* ---------- Арена: пол из треугольников, лучи прожекторов, пыль ---------- */
const tint = new THREE.Color('#7d8794'), tintTo = new THREE.Color('#7d8794');
scene.add(new THREE.HemisphereLight(0x8899aa, 0x080808, .5));
const key = new THREE.SpotLight(0xffffff, 3.2, 30, .55, .6, 1.2); key.position.set(0, 9, 4); key.target.position.set(0, 1, 0); scene.add(key, key.target);
const rimL = new THREE.PointLight(0xffffff, 3, 12, 2), rimR = rimL.clone(); rimL.position.set(-3.2, 2.6, -1.5); rimR.position.set(3.2, 2.6, -1.5); scene.add(rimL, rimR);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x07080b, metalness: .7, roughness: .38, emissive: tint.clone(), emissiveMap: tri, emissiveIntensity: .55, transparent: true, opacity: .9 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const beamMat = () => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { c: { value: tint.clone() }, a: { value: .22 } },
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'uniform vec3 c;uniform float a;varying vec2 vUv;void main(){float f=pow(vUv.y,1.6)*(1.-abs(vUv.x-.5)*1.6);gl_FragColor=vec4(c*f*a*2.2,1.);}' });
const beams = [-2.6, -1, 1, 2.6].map((x, i) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.08, 1.25, 11, 32, 1, true), beamMat()); m.geometry.translate(0, -5.5, 0); m.position.set(x, 10, -2.2 - (i % 2)); m.rotation.z = -x * .07; scene.add(m); return m; });
const DUST = 900, dg = new THREE.BufferGeometry(), dp = new Float32Array(DUST * 3), dv = new Float32Array(DUST * 3);
for (let i = 0; i < DUST; i++) { dp[i * 3] = (Math.random() - .5) * 14; dp[i * 3 + 1] = Math.random() * 7; dp[i * 3 + 2] = (Math.random() - .5) * 10 - 1; dv[i * 3 + 1] = .05 + Math.random() * .15; }
dg.setAttribute('position', new THREE.BufferAttribute(dp, 3));
const dust = new THREE.Points(dg, new THREE.PointsMaterial({ map: dot, size: .06, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xfff0d8, opacity: .7 })); scene.add(dust);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: tint.clone(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 })); glow.scale.set(6, 6, 1); glow.position.set(0, 1.3, -.6); scene.add(glow);
const ring = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 96), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })); ring.position.set(0, 1.3, 0); scene.add(ring);

/* ---------- 3D-кейс: корпус, крышка, светящиеся полосы, защёлки ---------- */
const caseG = new THREE.Group(); scene.add(caseG);
const metal = new THREE.MeshStandardMaterial({ color: 0x2b3038, metalness: .85, roughness: .32 }), dark = new THREE.MeshStandardMaterial({ color: 0x121418, metalness: .6, roughness: .5 });
const neon = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color('#f2c14e'), emissiveIntensity: 2.2 });
const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); caseG.add(b); return b; };
box(2.4, 1.15, .95, metal, 0, .58, 0); const lid = new THREE.Group(); caseG.add(lid); lid.position.set(0, 1.16, -.47);
const lidB = new THREE.Mesh(new THREE.BoxGeometry(2.4, .42, .95), metal); lidB.position.set(0, .21, .47); lid.add(lidB);
const seam = box(2.42, .05, .97, neon, 0, 1.16, 0);
for (const x of [-1.21, 1.21]) box(.04, 1.5, .97, dark, x, .78, 0);
box(2.1, .05, .02, neon, 0, .25, .48); box(1.4, .38, .02, dark, 0, .7, .48);
const latches = [-.7, .7].map(x => { const l = new THREE.Mesh(new THREE.BoxGeometry(.32, .3, .1), new THREE.MeshStandardMaterial({ color: 0xb9c2cc, metalness: .95, roughness: .2 })); l.position.set(x, 1.13, .52); caseG.add(l); return l; });
const logo = tex(512, 256, (g, w, h) => { g.fillStyle = '#0b0d10'; g.fillRect(0, 0, w, h); g.font = '700 120px Oswald, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#f2c14e'; g.fillText('ЭЛИТНЫЙ', w / 2, h / 2 + 6); });
const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.36, .34), new THREE.MeshStandardMaterial({ map: logo, emissive: 0xffffff, emissiveMap: logo, emissiveIntensity: .9, metalness: .2, roughness: .6 })); plate.position.set(0, .7, .495); caseG.add(plate);
caseG.position.set(0, .05, 0);

/* ---------- Осколки ---------- */
const SH = 90, shardM = new THREE.InstancedMesh(new THREE.TetrahedronGeometry(.16), new THREE.MeshStandardMaterial({ color: 0x3a4049, metalness: .9, roughness: .25, emissive: new THREE.Color('#ffffff'), emissiveIntensity: .25 }), SH);
shardM.instanceMatrix.setUsage(THREE.DynamicDrawUsage); shardM.visible = false; scene.add(shardM);
const shards = Array.from({ length: SH }, () => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Euler(), w: new THREE.Vector3(), s: 1 }));
const tmpO = new THREE.Object3D();
function blast() { shardM.visible = true; shards.forEach(s => { s.p.set((Math.random() - .5) * 2.2, .3 + Math.random() * 1.3, (Math.random() - .5) * .9); s.v.set(s.p.x * 3.2 + (Math.random() - .5) * 2, 2.5 + Math.random() * 4, 2 + Math.random() * 3.5); s.w.set(Math.random() * 9, Math.random() * 9, Math.random() * 9); s.s = .5 + Math.random() * 1.3; }); }

/* ---------- Карточка: тонкая пластина, металлический торец, голографическая лицевая сторона ---------- */
const CW = 1.9, CH = 2.66;
function drawFace(P, g, w, h) {
  const k = w / 720, cut = 90 * k;
  const path = () => { g.beginPath(); g.moveTo(0, 0); g.lineTo(w - cut, 0); g.lineTo(w, cut); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); };
  path(); g.save(); g.clip();
  let gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2b3038'); gr.addColorStop(.55, '#15181d'); gr.addColorStop(1, '#07080a'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createRadialGradient(w / 2, h * 1.02, 0, w / 2, h * 1.02, h * .7); gr.addColorStop(0, P.col + 'cc'); gr.addColorStop(1, P.col + '00'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  gr = g.createRadialGradient(w / 2, h * .34, 0, w / 2, h * .34, w * .55); gr.addColorStop(0, P.tc + '88'); gr.addColorStop(1, P.tc + '00'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 3 * k; for (let x = -h; x < w; x += 26 * k) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h * .55, 0); g.stroke(); }
  g.font = `700 ${360 * k}px Oswald, Impact, sans-serif`; g.fillStyle = 'rgba(255,255,255,.05)'; g.textAlign = 'right'; g.fillText(P.nick.slice(0, 2).toUpperCase(), w + 10 * k, 430 * k);
  /* силуэт игрока: в игре вместо него встанет фото */
  g.save(); g.translate(w * .56, h * .2); g.scale(5.2 * k, 5.2 * k);
  g.fillStyle = 'rgba(5,7,10,.92)'; g.beginPath(); g.moveTo(4 - 50, 100); g.bezierCurveTo(4 - 50, 76, 22 - 50, 67, 38 - 50, 64); g.lineTo(0, 73); g.lineTo(62 - 50, 64); g.bezierCurveTo(78 - 50, 67, 96 - 50, 76, 96 - 50, 100); g.fill();
  g.fillStyle = P.tc; g.beginPath(); g.moveTo(-12, 64); g.lineTo(0, 73); g.lineTo(12, 64); g.lineTo(15, 65); g.lineTo(0, 80); g.lineTo(-15, 65); g.fill();
  g.fillStyle = 'rgba(5,7,10,.95)'; g.fillRect(-7, 53, 14, 15); g.beginPath(); g.ellipse(0, 38, 16.5, 19.5, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = P.col; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.arc(0, 40, 19, Math.PI * 1.05, Math.PI * 1.95); g.stroke(); g.fillStyle = P.col; g.fillRect(-23, 34, 8, 15); g.fillRect(15, 34, 8, 15);
  g.restore();
  gr = g.createLinearGradient(0, h * .55, 0, h); gr.addColorStop(0, 'rgba(6,7,9,0)'); gr.addColorStop(.35, 'rgba(6,7,9,.92)'); gr.addColorStop(1, 'rgba(6,7,9,.98)'); g.fillStyle = gr; g.fillRect(0, h * .55, w, h * .45);
  g.textAlign = 'left'; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff'; g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 16 * k;
  g.font = `700 ${190 * k}px Oswald, Impact, sans-serif`; g.fillText(P.ovr, 40 * k, 200 * k); g.shadowBlur = 0;
  g.fillStyle = 'rgba(5,7,10,.75)'; g.fillRect(44 * k, 224 * k, 130 * k, 52 * k); g.fillStyle = P.col; g.font = `700 ${40 * k}px JetBrains Mono, monospace`; g.fillText(P.role, 58 * k, 264 * k);
  g.font = `${66 * k}px sans-serif`; g.fillText(flagOf(P.cc), 48 * k, 360 * k);
  g.fillStyle = P.col; g.font = `700 ${30 * k}px JetBrains Mono, monospace`; g.fillText(P.rar.toUpperCase(), 44 * k, h * .69);
  g.fillStyle = '#fff'; g.font = `700 ${100 * k}px Oswald, Impact, sans-serif`; g.fillText(P.nick.toUpperCase(), 40 * k, h * .78);
  g.fillStyle = P.tc; g.save(); g.translate(52 * k, h * .815); g.rotate(Math.PI / 4); g.fillRect(-9 * k, -9 * k, 18 * k, 18 * k); g.restore();
  g.fillStyle = 'rgba(255,255,255,.72)'; g.font = `500 ${40 * k}px Oswald, Impact, sans-serif`; g.fillText(P.team, 76 * k, h * .83);
  g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(40 * k, h * .855, w - 80 * k, 2 * k);
  P.st.forEach(([n, v], i) => { const x = 40 * k + (i % 3) * (w - 80 * k) / 3, y = h * .905 + Math.floor(i / 3) * 62 * k; g.fillStyle = '#fff'; g.font = `700 ${46 * k}px JetBrains Mono, monospace`; g.fillText(v, x, y); g.fillStyle = 'rgba(255,255,255,.6)'; g.font = `700 ${28 * k}px JetBrains Mono, monospace`; g.fillText(n, x + 66 * k, y); });
  g.restore(); path(); g.lineWidth = 10 * k; g.strokeStyle = P.col; g.stroke(); g.lineWidth = 2 * k; g.strokeStyle = 'rgba(255,255,255,.5)'; g.stroke();
}
function drawBack(P, g, w, h) {
  const k = w / 720, gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, P.col); gr.addColorStop(.5, '#16090b'); gr.addColorStop(1, P.col);
  g.fillStyle = '#0a0b0e'; g.fillRect(0, 0, w, h); g.globalAlpha = .85; g.fillStyle = gr; g.fillRect(0, 0, w, h); g.globalAlpha = 1;
  g.strokeStyle = 'rgba(255,255,255,.16)'; g.lineWidth = 4 * k; for (let x = -h; x < w; x += 34 * k) { g.beginPath(); g.moveTo(x, h); g.lineTo(x + h * .55, 0); g.stroke(); }
  g.save(); g.translate(w / 2, h * .44); g.strokeStyle = '#fff'; g.lineWidth = 12 * k; g.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; g.lineTo(Math.cos(a) * 150 * k, Math.sin(a) * 150 * k); } g.closePath(); g.stroke();
  g.fillStyle = '#fff'; g.font = `700 ${150 * k}px Oswald, Impact, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('5', 0, 8 * k); g.restore();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `700 ${44 * k}px JetBrains Mono, monospace`; g.textAlign = 'center'; g.fillText('ПЯТЁРКА ЛЕГЕНД', w / 2, h * .78);
  g.lineWidth = 14 * k; g.strokeStyle = 'rgba(255,255,255,.6)'; g.strokeRect(0, 0, w, h);
}
const holo = map => new THREE.ShaderMaterial({ uniforms: { map: { value: map }, t: { value: 0 }, sweep: { value: -1 }, foil: { value: .9 } },
  vertexShader: 'varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader: `uniform sampler2D map;uniform float t;uniform float sweep;uniform float foil;varying vec2 vUv;varying vec3 vN;varying vec3 vV;
  vec3 hue(float h){return clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);}
  void main(){vec4 b=texture2D(map,vUv);float ang=dot(vN,vV);vec2 tilt=vN.xy;float l=dot(b.rgb,vec3(.299,.587,.114));
  vec3 ir=hue(fract(vUv.x*.35+vUv.y*.45+tilt.x*1.4+tilt.y*1.1+t*.02));float edge=smoothstep(.0,.06,min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y)));float m=foil*(.05+.22*pow(1.-l,2.))*(1.-edge*.55)*(.5+.5*abs(tilt.x+tilt.y)*2.);
  float s=smoothstep(.09,0.,abs(vUv.x*.6+vUv.y*.8-sweep))*.55;float spec=pow(max(0.,ang),24.)*.08;
  vec3 c=b.rgb*.92+ir*m+vec3(s)*b.rgb*1.4+spec;gl_FragColor=vec4(c,1.);
  #include <tonemapping_fragment>
  #include <encodings_fragment>
  }` });
const card = new THREE.Group(), cardPivot = new THREE.Group(); cardPivot.add(card); scene.add(cardPivot); cardPivot.position.set(0, 1.42, 0);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: .2, emissive: new THREE.Color('#000') });
let faceMat = null, backMat = null, cardMesh = null, mirror = null;
function buildCard(P) {
  if (cardMesh) { card.remove(cardMesh); scene.remove(mirror); }
  const ft = tex(720, 1008, (g, w, h) => drawFace(P, g, w, h)), bt = tex(720, 1008, (g, w, h) => drawBack(P, g, w, h));
  faceMat = holo(ft); faceMat.uniforms.foil.value = P.walk ? 1 : .35;
  backMat = new THREE.MeshStandardMaterial({ map: bt, metalness: .55, roughness: .35, emissive: 0xffffff, emissiveMap: bt, emissiveIntensity: .35 });
  edgeMat.color.set(P.col); edgeMat.emissive.set(P.col); edgeMat.emissiveIntensity = .5;
  cardMesh = new THREE.Mesh(new THREE.BoxGeometry(CW, CH, .045), [edgeMat, edgeMat, edgeMat, edgeMat, faceMat, backMat]); card.add(cardMesh);
  mirror = cardMesh.clone(); mirror.material = cardMesh.material.map(m => { const c = m.clone(); c.transparent = true; c.opacity = .18; return c; });
  scene.add(mirror);
}

/* ---------- Флаг и плашка команды ---------- */
const wave = map => new THREE.ShaderMaterial({ transparent: true, side: THREE.DoubleSide, uniforms: { map: { value: map }, t: { value: 0 }, a: { value: 0 } },
  vertexShader: 'uniform float t;varying vec2 vUv;varying float vS;void main(){vUv=uv;vec3 p=position;float w=sin(p.x*3.2-t*5.)*.09*(uv.x+.15)+sin(p.y*4.-t*3.)*.03*uv.x;p.z+=w;vS=w;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
  fragmentShader: 'uniform sampler2D map;uniform float a;varying vec2 vUv;varying float vS;void main(){vec4 c=texture2D(map,vUv);c.rgb*=1.+vS*3.;gl_FragColor=vec4(c.rgb,c.a*a);\n#include <encodings_fragment>\n}' });
let flag = null, teamP = null;
function buildSigns(P) {
  [flag, teamP].forEach(m => m && scene.remove(m));
  const ft = tex(512, 340, (g, w, h) => { g.clearRect(0, 0, w, h); g.font = '300px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(flagOf(P.cc), w / 2, h / 2 + 20);
    const d = g.getImageData(w / 2 - 4, h / 2 - 4, 8, 8).data; let any = 0; for (let i = 3; i < d.length; i += 4) any += d[i]; if (!any) { g.fillStyle = '#fff'; g.font = '700 200px Oswald, Impact, sans-serif'; g.fillText(P.cc, w / 2, h / 2 + 10); } });
  flag = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 1.4, 40, 24), wave(ft)); flag.position.set(0, 3.55, -.3); scene.add(flag);
  const tt = tex(1024, 220, (g, w, h) => { const gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.15, 'rgba(0,0,0,.85)'); gr.addColorStop(.85, 'rgba(0,0,0,.85)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = P.tc; g.fillRect(w * .12, 0, w * .76, 8); g.fillRect(w * .12, h - 8, w * .76, 8); g.fillStyle = '#fff'; g.font = '700 130px Oswald, Impact, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(P.team.toUpperCase(), w / 2, h / 2 + 8); });
  teamP = new THREE.Mesh(new THREE.PlaneGeometry(3.4, .73, 30, 6), wave(tt)); teamP.position.set(0, 3.45, -.2); scene.add(teamP);
}

/* ---------- Сценарий ---------- */
let P = DEMO.walk, phase = 'idle', T0 = 0, shake = 0;
const steps = [];                                   // [время, действие] от момента нажатия
const ui = (t, s, col) => { const a = $('#tt'), b = $('#st'); a.textContent = t || ''; b.textContent = s || ''; a.style.setProperty('--gl', col || '#fff'); b.style.setProperty('--gl', col || '#fff'); a.classList.toggle('on', !!t); b.classList.toggle('on', !!s); };
const flash = (a = .6) => { if (reduce) return; const f = $('#flash'); f.style.transition = 'none'; f.style.opacity = a; requestAnimationFrame(() => { f.style.transition = 'opacity .45s'; f.style.opacity = 0; }); };
const S = { case: 1, back: 0, face: 0, flag: 0, team: 0, spin: 0, glow: 0, ring: -1, beam: .22, dolly: 0, sweep: -1 };
function reset(k) {
  P = DEMO[k]; buildCard(P); buildSigns(P); phase = 'idle'; steps.length = 0; shardM.visible = false;
  Object.assign(S, { case: 1, back: 0, face: 0, flag: 0, team: 0, spin: 0, glow: 0, ring: -1, beam: .22, dolly: 0, sweep: -1 });
  lid.rotation.x = 0; latches.forEach(l => { l.rotation.x = 0; }); neon.emissive.set('#f2c14e'); neon.emissiveIntensity = 2.2; tintTo.set('#7d8794');
  ui(''); $('#hint').style.visibility = 'visible'; $('#eb').textContent = P.walk ? 'Кейс «Элитный» · редкий игрок' : 'Кейс «Базовый» · обычная карточка';
}
function open() {
  if (phase !== 'idle') return; phase = 'run'; T0 = performance.now() / 1000; $('#hint').style.visibility = 'hidden';
  const W = P.walk, c = new THREE.Color(P.col);
  const at = (t, f) => steps.push([reduce ? Math.min(t, .3) : t, f]);
  at(0, () => { shake = W ? 1 : .5; neon.emissive.copy(c); tintTo.copy(c).multiplyScalar(.6); });
  at(.35, () => { latches.forEach((l, i) => { l.userData.pop = 1; }); });
  at(W ? .95 : .6, () => { flash(W ? .6 : .35); blast(); S.case = 0; S.back = 1; S.spin = W ? 14 : 6; S.ring = 0; S.glow = W ? .9 : .6; S.beam = .5; tintTo.copy(c); });
  if (W) {
    at(2.3, () => { S.flag = 1; S.beam = .45; tintTo.setHSL((P.cc.charCodeAt(0) * 37 + P.cc.charCodeAt(1) * 11) % 360 / 360, .75, .5); ui(''); });
    at(4.0, () => { S.flag = 0; S.team = 1; tintTo.set(P.tc); S.spin += 6.283; });
    at(5.7, () => { S.team = 0; S.glow = 1.6; tintTo.copy(c); S.spin += Math.PI * 3; S.beam = .8; });
    at(6.35, () => { flash(.7); S.face = 1; S.ring = 0; burst(c, 1); S.dolly = 1; S.sweep = 0; ui(P.nick, P.rar + ' · ' + P.ovr, P.col); });
    at(7.6, () => { phase = 'done'; });
  } else {
    at(1.0, () => { S.face = 1; S.spin = Math.PI; burst(c, .35); S.sweep = 0; ui(P.nick, P.rar + ' · ' + P.ovr, P.col); });
    at(2.0, () => { phase = 'done'; });
  }
}
function skip() { if (phase !== 'run') return; steps.forEach(s => s[1]()); steps.length = 0; flash(.6); }
/* всплеск частиц при раскрытии */
const BP = 600, bg = new THREE.BufferGeometry(), bp = new Float32Array(BP * 3), bv = new Float32Array(BP * 3); bg.setAttribute('position', new THREE.BufferAttribute(bp, 3));
const bMat = new THREE.PointsMaterial({ map: dot, size: .09, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }), bPts = new THREE.Points(bg, bMat); scene.add(bPts);
let bLife = 0;
function burst(c, power) { bMat.color.copy(c).lerp(new THREE.Color('#fff'), .35); bMat.opacity = 1; bLife = 1; for (let i = 0; i < BP; i++) { const a = Math.random() * 6.283, z = Math.random() * 2 - 1, r = Math.sqrt(1 - z * z), s = (2 + Math.random() * 6) * power; bp[i * 3] = 0; bp[i * 3 + 1] = 1.42; bp[i * 3 + 2] = 0; bv[i * 3] = Math.cos(a) * r * s; bv[i * 3 + 1] = z * s; bv[i * 3 + 2] = Math.sin(a) * r * s * .6; } bg.attributes.position.needsUpdate = true; }

/* ---------- Управление ---------- */
const ptr = { x: 0, y: 0 };
cv.addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = e.clientY / innerHeight * 2 - 1; });
cv.addEventListener('pointerup', () => { if (phase === 'idle') open(); else if (phase === 'run') skip(); });
document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { reset(b.dataset.k); }));
$('#skip').addEventListener('click', skip);

/* ---------- Кадр ---------- */
let last = performance.now() / 1000, rot = 0;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - last); last = now; const t = phase === 'idle' ? 0 : now - T0;
  while (steps.length && steps[0][0] <= t) steps.shift()[1]();
  tint.lerp(tintTo, 1 - Math.pow(.02, dt));
  floorMat.emissive.copy(tint); floorMat.emissiveIntensity = .35 + S.beam * .5; tri.offset.y -= dt * .04;
  beams.forEach((b, i) => { b.material.uniforms.c.value.copy(tint); b.material.uniforms.a.value = lerp(b.material.uniforms.a.value, S.beam, dt * 3); b.rotation.z = Math.sin(now * .5 + i * 1.7) * .16 - b.position.x * .05; });
  rimL.color.copy(tint); rimR.color.copy(tint); key.color.copy(tint).lerp(new THREE.Color('#fff'), .6);
  for (let i = 0; i < DUST; i++) { dp[i * 3 + 1] += dv[i * 3 + 1] * dt; if (dp[i * 3 + 1] > 7) dp[i * 3 + 1] = 0; } dg.attributes.position.needsUpdate = true;
  /* кейс */
  caseG.visible = S.case > 0; if (caseG.visible) { const sh = shake * (t < 1 ? t : 1); caseG.position.set(Math.sin(now * 61) * .05 * sh, .05 + Math.sin(now * 1.6) * .06, Math.cos(now * 47) * .03 * sh); caseG.rotation.y = phase === 'idle' ? Math.sin(now * .7) * .35 : caseG.rotation.y * .9; caseG.rotation.z = Math.sin(now * 53) * .03 * sh;
    neon.emissiveIntensity = 2.2 + sh * (2 + Math.sin(now * 30) * 1.5); seam.scale.y = 1 + sh * 2; latches.forEach(l => { if (l.userData.pop) l.rotation.x = lerp(l.rotation.x, -1.6, dt * 12); }); if (shake) lid.rotation.x = lerp(lid.rotation.x, -.12 * sh, dt * 10); }
  /* осколки */
  if (shardM.visible) { let alive = 0; shards.forEach((s, i) => { s.v.y -= 9.8 * dt; s.p.addScaledVector(s.v, dt); if (s.p.y < .05) { s.p.y = .05; s.v.y *= -.35; s.v.x *= .7; s.v.z *= .7; } s.r.x += s.w.x * dt; s.r.y += s.w.y * dt; s.r.z += s.w.z * dt; if (s.p.y > .06 || s.v.lengthSq() > .1) alive++;
    tmpO.position.copy(s.p); tmpO.rotation.copy(s.r); tmpO.scale.setScalar(s.s); tmpO.updateMatrix(); shardM.setMatrixAt(i, tmpO.matrix); }); shardM.instanceMatrix.needsUpdate = true; shardM.material.emissive.copy(tint); }
  /* карточка */
  const vis = S.back || S.face; card.visible = !!vis; mirror.visible = !!vis;
  const sc = lerp(card.scale.x || .01, vis ? 1 : .01, dt * 6); card.scale.setScalar(sc);
  const target = S.face ? (S.spin - S.spin % 6.283) + (S.spin % 6.283 > Math.PI ? 6.283 : 0) : S.spin; // лицом к камере после раскрытия
  rot = lerp(rot, target + (S.back && !S.face ? now * .9 : 0), dt * (S.face ? 3.2 : 2.2));
  const tiltX = phase === 'done' ? -ptr.y * .22 : Math.sin(now * 1.1) * .05, tiltY = phase === 'done' ? ptr.x * .35 : 0;
  card.rotation.set(tiltX, rot + tiltY, Math.sin(now * .8) * .02); cardPivot.position.y = 1.42 + Math.sin(now * 1.3) * .05;
  if (S.face && cardMesh.material[5] !== backMat) { /* лицевая сторона всегда +z, рубашка −z */ }
  mirror.position.set(0, -cardPivot.position.y, 0); mirror.rotation.set(-card.rotation.x, card.rotation.y, -card.rotation.z); mirror.scale.set(sc, -sc, sc);
  if (faceMat) { faceMat.uniforms.t.value = now; if (S.sweep >= 0) { S.sweep += dt * .9; faceMat.uniforms.sweep.value = S.sweep * 2.2 - .3; if (S.sweep > 1.4) S.sweep = phase === 'done' ? -1.6 : 1.4; } else { S.sweep += dt * .25; if (S.sweep > -.0001 && S.sweep < .01) S.sweep = 0; } }
  edgeMat.emissiveIntensity = .4 + S.glow * .8;
  glow.material.color.copy(tint); glow.material.opacity = lerp(glow.material.opacity, S.glow * (.75 + Math.sin(now * 3) * .1), dt * 3); glow.position.y = cardPivot.position.y;
  if (S.ring >= 0) { S.ring += dt * 1.4; ring.scale.setScalar(.3 + S.ring * 6); ring.material.opacity = Math.max(0, 1 - S.ring) * .9; ring.material.color.copy(tint).lerp(new THREE.Color('#fff'), .4); ring.lookAt(cam.position); if (S.ring > 1) S.ring = -1; }
  if (bLife > 0) { bLife -= dt * .7; for (let i = 0; i < BP; i++) { bv[i * 3 + 1] -= 2.5 * dt; bp[i * 3] += bv[i * 3] * dt; bp[i * 3 + 1] += bv[i * 3 + 1] * dt; bp[i * 3 + 2] += bv[i * 3 + 2] * dt; bv[i * 3] *= .985; bv[i * 3 + 2] *= .985; } bg.attributes.position.needsUpdate = true; bMat.opacity = Math.max(0, bLife); }
  /* флаг и команда */
  for (const [m, on] of [[flag, S.flag], [teamP, S.team]]) { if (!m) continue; const u = m.material.uniforms; u.t.value = now; u.a.value = lerp(u.a.value, on, dt * 5); m.position.y = lerp(m.position.y, on ? 3.45 : 4.6, dt * 4); m.visible = u.a.value > .01; }
  /* камера */
  S.dolly && (S.dollyT = Math.min(1, (S.dollyT || 0) + dt * .6));
  const d = easeIO(S.dollyT || 0); cam.position.set(camBase.x + ptr.x * .25 + Math.sin(now * .3) * .15, camBase.y + .1 * Math.sin(now * .4) - d * .15, camBase.z - d * 1.6);
  cam.lookAt(look.x, look.y + (S.flag || S.team ? .5 : 0) * (1 - d), look.z);
  R3.render(scene, cam); requestAnimationFrame(frame);
}
(document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).then(() => { reset('walk'); requestAnimationFrame(frame); });
</script></body></html>
